  .chart-controls select{min-height:44px}
  .chart-grid{gap:24px}
  .data-chart{min-height:0;max-height:190px}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .actions button{width:100%;min-width:0;padding:10px 8px}
  .actions button:last-child:nth-child(odd){grid-column:1/-1}
  .table-wrap{margin:0 -18px;padding:0 18px;max-height:70vh}
  dialog{width:calc(100vw - 20px);max-height:92vh;padding:18px;border-radius:20px}
  footer{padding:4px 2px 18px;line-height:1.5}

  body>main{padding:18px 16px 48px}

  body>main .amount-input{font-size:30px}
}

=\"comparison\" style=\"width:180px\">${selectOptions(all,comparison)}<\/select><\/div><div class=\"stats\">${metric('순자산 차이',a!==null&&b!==null?won(a-b):'잔액 확인 필요')}${metric('수입 차이',old?won(total('income')-total('income',comparison)):'비교 자료 없음')}${metric('지출 차이',old?won(total('expenses')-total('expenses',comparison)):'비교 자료 없음')}<\/div><div class=\"table-wrap\"><table><thead><tr><th>지출 분류<\/th><th>${comparison}<\/th><th>${month}<\/th><th>변화<\/th><\/tr><\/thead><tbody>${[...new Set([...rows('expenses'),...rows('expenses',comparison)].map(r=>r.category))].map(c=>{const val=date=>sum(rows('expenses',date).filter(r=>r.category===c).map(r=>actual('expenses',r,date)||0)),v=val(month),p=val(comparison);return `<tr><td>${esc(c)}<\/td><td>${won(p)}<\/td><td>${won(v)}<\/td><td>${won(v-p)}<\/td><\/tr>`}).join('')}<\/tbody><\/table><\/div><\/section><section class=\"card\"><h2>월말 메모와 함께 확인<\/h2><form id=\"month-note\"><label>이번 달 돌아보기<textarea name=\"note\" maxlength=\"500\" rows=\"3\" ${locked()?'disabled':''}>${esc(m.note)}<\/textarea><\/label><div class=\"actions\">${button('메모 저장',locked()?'disabled':'')}<\/div><\/form><p class=\"notice\">자산·부채·수입·지출의 미입력 항목을 채우고 확인합니다. 두 사람 모두 확인하면 이 달은 수정 잠금 상태가 됩니다.<\/p>${state.names.map((n,i)=>`<div class=\"check\"><span>${esc(n)} · ${m.done[i]?'확인 완료':'확인 대기'}<\/span>${button(m.done[i]?'확인 완료':'정산 확인',`data-confirm=\"${i}\" ${m.done[i]?'disabled':''}`)}<\/div>`).join('')}${m.done.some(Boolean)?`<div class=\"actions\">${button('확인 해제 / 수정 다시 열기','id=\"reopen\"')}<\/div>`:''}<\/section>`}`}\nfunction newMonthView(){return `<section class=\"card\"><h2>${month}은 아직 시작하지 않았어요.<\/h2><p>이전 월의 항목을 가져와 새 달의 예산과 잔액을 관리하세요. 수입·지출 실제 금액과 거래 내역은 복사하지 않습니다.<\/p><div class=\"actions\">${button('이 달 시작하기','id=\"new-month\"',true)}${button('기존 월 보기','data-go=\"report\"')}<\/div><\/section>`}\nfunction newMonthDialog(){const all=Object.keys(state.months).sort();openDialog(`<h2>새 달 시작<\/h2><form id=\"new-month-form\"><div class=\"fields\"><label>새로 관리할 y=cloudReady(),last=cloudConfig.lastRemote?new Date(cloudConfig.lastRemote).toLocaleString('ko-KR'):'아직 동기화하지 않음';return `<section class=\"card\"><div class=\"row\" style=\"justify-content:space-between\"><div><span class=\"eyebrow\">기기 간 데이터 유지<\/span><h2>암호화 클라우드 동기화<\/h2><\/div><span class=\"badge\">${ready?'연결 설정됨':'설정 필요'}<\/span><\/div><p>다른 휴대폰이나 PC에서도 같은 데이터를 사용합니다. 데이터는 이 브라우저에서 암호화된 뒤 저장됩니다.<\/p><form id=\"cloud-config-form\"><div class=\"fields\"><label class=\"wide\">Supabase 프로젝트 URL<input name=\"url\" type=\"url\" required placeholder=\"https://프로젝트.supabase.co\" value=\"${esc(cloudConfig.url||'')}\"><\/label><label class=\"wide\">Supabase Publishable key 또는 anon key<input name=\"anonKey\" type=\"password\" required autocomplete=\"off\" value=\"${esc(cloudConfig.anonKey||'')}\"><\/label><label>가족 동기화 코드<input name=\"syncId\" required maxlength=\"36\" value=\"${esc(cloudConfig.syncId||'')}\"><\/label><label>동기화 비밀번호<input name=\"passphrase\" type=\"password\" required minlength=\"10\" autocomplete=\"off\" value=\"${esc(cloudConfig.passphrase||'')}\"><\/label><\/div><p class=\"notice\">다른 기기에도 같은 동기화 코드와 비밀번호를 입력하세요. 기기별 변경이 겹치면 항목 비교 화면에서 반영할 값을 선택합니다.<\/p><div class=\"actions\"><button type=\"button\" id=\"cloud-generate\">새 동기화 코드 만들기<\/button><button class=\"primary\">연결 설정 저장<\/button><\/div><\/form><div class=\"actions\"><button id=\"cloud-upload\" ${ready?'':'disabled'}>비교 후 클라우드 저장<\/button><button id=\"cloud-download\" ${ready?'':'disabled'}>클라우드 데이터로 교체<\/button><button id=\"cloud-disconnect\" ${ready?'':'disabled'}>이 기기 연결 해제<\/button><\/div><p class=\"sub\">마지막 확인: ${esc(last)} · 다른 기기의 변경이 발견되면 자동으로 덮어쓰지 않습니다.<\/p><div id=\"cloud-status\" class=\"saved\" role=\"status\" aria-live=\"polite\"><\/div><\/section>`}\nconst bytesToBase64=bytes=>{let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s)};\nconst base64ToBytes=text=>Uint8Array.from(atob(text),c=>c.charCodeAt(0));\nasync function cloudKey(){const material=await crypto.su  const css=document.createElement('style');css.textContent=`body.access-locked>*:not(#access-lock){visibility:hidden}#access-lock{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:20px;background:#f9fafb;color:#191f28;font-family:Pretendard,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#access-lock .box{width:min(420px,100%);padding:32px;background:#fff;border:1px solid #e5e8eb;border-radius:18px}#access-lock h1{margin:5px 0 8px;font-size:28px}#access-lock p{margin:0 0 22px;color:#6b7684}#access-lock label{display:block;font-size:14px;color:#6b7684}#access-lock input{width:100%;height:52px;margin-top:7px;padding:0 14px;border:1px solid #b0b8c1;border-radius:11px;font:inherit}#access-lock button{width:100%;height:52px;margin-top:14px;border:0;border-radius:11px;background:#3182f6;color:#fff;font:600 16px inherit;cursor:pointer}#access-lock button:disabled{opacity:.55}#access-lock .error{min-height:22px;margin-top:12px;color:#f04452;font-size:14px}#access-lock .eyebrow{color:#3182f6;font-size:13px;font-weight:700}`;document.head.append(css);
 document.body.classList.add('access-locked');const lock=document.createElement('div');lock.id='access-lock';lock.innerHTML=`<form class="box"><div class="eyebrow">우리의 자산 노트</div><h1>PIN을 입력해 주세요</h1><p>자산 내역을 확인하려면 숫자 6자리 PIN이 필요합니다.</p><label>접근 PIN<input name="password" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autocomplete="current-password" autofocus></label><button>자산 노트 열기</button><div class="error" role="alert" aria-live="polite"></div></form>`;document.body.append(lock);
 const from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 lock.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const button=lock.querySelector('button'),error=lock.querySelector('.error'),password=new FormData(e.target).get('password');button.disabled=true;button.textContent='확인하고 있어요…';error.textContent='';try{const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:from64(pack.salt),iterations:pack.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(pack.iv),additionalData:new TextEncoder().encode('asset-note-source-v1')},key,from64(pack.data)),source=new TextDecoder().decode(plain),sourceScript=document.createElement('script');sourceScript.id='source-data';sourceScript.type='application/json';sourceScript.textContent=source;document.body.append(sourceScript);document.body.classList.remove('access-locked');lock.remove();const app=document.createElement('script');app.textContent=code;document.body.append(app)}catch{error.textContent='비밀번호가 올바르지 않습니다.';button.disabled=false;button.textContent='자산 노트 열기';e.target.elements.password.select()}});
 })();
</script></body></html>
