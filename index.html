  .chart-controls select{min-height:44px}
  .chart-grid{gap:24px}
  .data-chart{min-height:0;max-height:190px}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .actions button{width:100%;min-width:0;padding:10px 8px}
  .actions button:last-child:nth-child(odd){grid-column:1/-1}
  .table-wrap{margin:0 -18px;padding:0 18px;max-height:70vh}
  dialog{width:calc(100vw - 20px);max-height:92vh;padding:18px;border-radius:20px}
  footer{padding:4px 2px 18px;line-height:1.5}

  body>main{padding:18px 16px 48px}

  body>main .amount-input{font-size:30px}
}

'expenses').filter(r=>linked('expenses',r.id).some(e=>e.mode==='evidence')).map(r=>{const ev=sum(linked('expenses',r.id).filter(e=>e.mode==='evidence').map(e=>e.amount));return `<tr><td>${esc(r.item)} · ${esc(r.owner)}<\/td><td>${won(r.amount)}<\/td><td>${won(ev)}<\/td><td class=\"${ev>(r.amount||0)?'negative':''}\">${r.amount===null?'기본 합계 미입력':won(r.amount-ev)}<\/td><\/tr>`}).join('')||'<tr><td colspan=\"4\">기존 합계의 증빙을 입력하면 항목별 남은 금액을 확인할 수 있어요.<\/td><\/tr>'}<\/tbody><\/table><\/div><\/section>`}\nfunction entryDialog(id,zero=false){const e=state.entries.find(e=>e.id===id)||{id:uid(),date:month===today().slice(0,7)?today():month+'-01',kind:'expenses',rowId:rows('expenses')[0]?.id||'',mode:'add',item:zero?'무지출 하루':'',amount:0,note:''};openDialog(`<h2>${id==='new'?'거래 추가':'거래 수정'}<\/h2><form id=\"entry-form\" data-id=\"${e.id}\"><fieldset ${locked()?'disabled':''}><div class=\"fields\"><label>날짜<input name=\"date\" type=\"date\" required value=\"${e.date}\" min=\"${month}-01\" max=\"${month}-${new Date(Number(month.slice(0,4)),Number(month.slice(5)),0).getDate()}\"><\/label><label>종류<select name=\"kind\" id=\"entry-kind\">${Object.entries({expenses:'지출',income:'수입'}).map(([v,l])=>`<option value=\"${v}\" ${e.kind===v?'selected':''}>${l}<\/option>`).join('')}<\/select><\/label><label class=\"wide\">연결할 월 항목<select name=\"rowId\" id=\"entry-row\" required>${entryOptions(e.kind,e.rowId)}<\/select><\/label><label class=\"wide\">반영 방식<select name=\"mode\"><option value=\"add\" ${e.mode==='add'?'selected':''}>신규 거래 — 월 합계에 금액 추가<\/option><option value=\"evidence\" ${e.mode==='evidence'?'selected':''}>기존 합계의 증빙 — 합계 그대로<\/option><\/select><\/label><label>상점·거래 내용<input name=\"item\" required maxlength=\"120\" value=\"${esc(e.item)}\"><\/label><label>금액 (원)<input name=\"amount\" type=\"number\" min=\"0\" max=\"100000000000000\" step=\"1\" required value=\"${e.amount}\"><\/label><label class=\"wide\">메모<textarea name=\"note\" rows=\"3\" maxlength=\"500\">${esc(e.note)}<\/text
