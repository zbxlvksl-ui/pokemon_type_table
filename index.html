  .chart-controls select{min-height:44px}
  .chart-grid{gap:24px}
  .data-chart{min-height:0;max-height:190px}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .actions button{width:100%;min-width:0;padding:10px 8px}
  .actions button:last-child:nth-child(odd){grid-column:1/-1}
  .table-wrap{margin:0 -18px;padding:0 18px;max-height:70vh}
  dialog{width:calc(100vw - 20px);max-height:92vh;padding:18px;border-radius:20px}
  footer{padding:4px 2px 18px;line-height:1.5}

  body>main{padding:18px 16px 48px}

  body>main .amount-input{font-size:30px}
}

=\"comparison\" style=\"width:180px\">${selectOptions(all,comparison)}<\/select><\/div><div class=\"stats\">${metric('순자산 차이',a!==null&&b!==null?won(a-b):'잔액 확인 필요')}${metric('수입 차이',old?won(total('income')-total('income',comparison)):'비교 자료 없음')}${metric('지출 차이',old?won(total('expenses')-total('expenses',comparison)):'비교 자료 없음')}<\/div><div class=\"table-wrap\"><table><thead><tr><th>지출 분류<\/th><th>${comparison}<\/th><th>${month}<\/th><th>변화<\/th><\/tr><\/thead><tbody>${[...new Set([...rows('expenses'),...rows('expenses',comparison)].map(r=>r.category))].map(c=>{const val=date=>sum(rows('expenses',date).filter(r=>r.category===c).map(r=>actual('expenses',r,date)||0)),v=val(month),p=val(comparison);return `<tr><td>${esc(c)}<\/td><td>${won(p)}<\/td><td>${won(v)}<\/td><td>${won(v-p)}<\/td><\/tr>`}).join('')}<\/tbody><\/table><\/div><\/section><section class=\"card\"><h2>월말 메모와 함께 확인<\/h2><form id=\"month-note\"><label>이번 달 돌아보기<textarea name=\"note\" maxlength=\"500\" rows=\"3\" ${locked()?'disabled':''}>${esc(m.note)}<\/textarea><\/label><div class=\"actions\">${button('메모 저장',locked()?'disabled':'')}<\/div><\/form><p class=\"notice\">자산·부채·수입·지출의 미입력 항목을 채우고 확인합니다. 두 사람 모두 확인하면 이 달은 수정 잠금 상태가 됩니다.<\/p>${state.names.map((n,i)=>`<div class=\"check\"><span>${esc(n)} · ${m.done[i]?'확인 완료':'확인 대기'}<\/span>${button(m.done[i]?'확인 완료':'정산 확인',`data-confirm=\"${i}\" ${m.done[i]?'disabled':''}`)}<\/div>`).join('')}${m.done.some(Boolean)?`<div class=\"actions\">${button('확인 해제 / 수정 다시 열기','id=\"reopen\"')}<\/div>`:''}<\/section>`}`}\nfunction newMonthView(){return `<section class=\"card\"><h2>${month}은 아직 시작하지 않았어요.<\/h2><p>이전 월의 항목을 가져와 새 달의 예산과 잔액을 관리하세요. 수입·지출 실제 금액과 거래 내역은 복사하지 않습니다.<\/p><div class=\"actions\">${button('이 달 시작하기','id=\"new-month\"',true)}${button('기존 월 보기','data-go=\"report\"')}<\/div><\/section>`}\nfunction newMonthDialog(){const all=Object.keys(state.months).sort();openDialog(`<h2>새 달 시작<\/h2><form id=\"new-month-form\"><div class=\"fields\"><label>새로 관리할
