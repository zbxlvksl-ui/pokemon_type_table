/* Mobile-first polish for phone Chrome. Desktop layout remains unchanged. */
@media (max-width:650px){
  :root{--mobile-key:#007e72;--mobile-key-dark:#075f58;--mobile-tint:#e7f4f1;--mobile-surface:#fff}
  html{scroll-padding-top:132px}

  .shell>main{padding:18px 14px 72px}

    margin:0 0 16px;padding:0 2px

  .shell>main>header input{width:150px;min-height:44px;margin-top:0;padding:8px}

  .monthbar{

  .hero .big{font-size:31px;line-height:1.1}

  .chart-head{gap:14px;margin-bottom:16px}
  .chart-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
  .chart-controls label{min-width:0;font-size:12px}
  .chart-controls select{min-height:44px}
  .chart-grid{gap:24px}
  .data-chart{min-height:0;max-height:190px}
  .chart-key{gap:7px 12px;margin:10px 0}
  .chart-key span{font-size:12px}
  .bar-row{margin-bottom:14px}
  .bar-label{font-size:13px}
  .bar-track{height:10px}
  .big-number{font-size:30px;line-height:1.15;overflow-wrap:anywhere}
  .view-tabs{gap:7px;margin:0 -4px 16px;padding:4px;scrollbar-width:none}
  .view-tabs::-webkit-scrollbar{display:none}
  .view-tabs button{min-height:40px;padding:8px 12px;border-radius:999px;font-size:13px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .filters label{min-width:0}
  .filters .wide,.filters .check-inline{grid-column:1/-1}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .actions button{width:100%;min-width:0;padding:10px 8px}
  .actions button:last-child:nth-child(odd){grid-column:1/-1}
  .table-wrap{margin:0 -18px;padding:0 18px;max-height:70vh}
  dialog{width:calc(100vw - 20px);max-height:92vh;padding:18px;border-radius:20px}
  footer{padding:4px 2px 18px;line-height:1.5}

  body>main{padding:18px 16px 48px}
  body>main>header{margin:0 0 18px;padding:18px;border-radius:20px;background:var(--mobile-tint)}
  body>main>header h1{font-size:31px;line-height:1.05}

  body>main .card{padding:20px}
  body>main .amount-input{font-size:30px}
}

('dialog');dialog.className='zero-dialog';dialog.innerHTML=`<div class=\"zero-dialog-inner\"><p class=\"sub\">${owner} · ${kinds[kind]}<\/p><h2>0원 항목을 확인해 주세요<\/h2><p>다음 항목에 입력된 값이 0원 입니다. 다시 한 번 확인해 주세요.<\/p><ul class=\"zero-list\">${zero.map(r=>`<li><span><strong>${esc(r.item)}<\/strong><br><small>${esc(r.category)}<\/small><\/span><strong>0원<\/strong><\/li>`).join('')||'<li><span>0원 항목이 없습니다.<\/span><\/li>'}<\/ul><div class=\"actions\"><button data-confirm=\"edit\">다시 편집하기<\/button><button class=\"primary\" data-confirm=\"save\">현재 상태 저장<\/button><\/div><\/div>`;document.body.append(dialog);dialog.addEventListener('click',e=>{const choice=e.target.closest('[data-confirm]')?.dataset.confirm;if(!choice)return;dialog.close();dialog.remove();if(choice==='save'){step=2;render()}});dialog.addEventListener('cancel',()=>dialog.remove(),{once:true});dialog.showModal()}\nfunction calculateExpression(expression){if(!expression)return 0;const safe=expression.replaceAll('×','*').replaceAll('÷','/');if(!/^\\d+(?:[+\\-*/]\\d+)*$/.test(safe))throw Error('계산식을 확인해 주세요.');const result=Function(`\"use strict\";return (${safe})`)();if(!Number.isFinite(result)||result<0||result>100000000000000)throw Error('계산 결과를 확인해 주세요.');return Math.round(result)}\nfunction openCalculator(){document.querySelector('#calculator-popover')?.remove();const input=$('#amount'),start=input?.value&&input.value!=='0'?input.value:'',panel=document.createElement('div');panel.id='calculator-popover';panel.className='calculator-popover';panel.setAttribute('popover','auto');panel.dataset.expression=start;panel.innerHTML=`<div class=\"calculator-title\"><strong>금액 계산<\/strong><button type=\"button\" data-calc=\"close\" aria-label=\"계산기 닫기\">×<\/button><\/div><output id=\"calculator-display\" class=\"calculator-display\">${start||'0'}<\/output><div class=\"calculator-grid\"><button type=\"button\" data-calc=\"clear\">C<\/button><button type=\"button\" data-calc=\"back\">⌫<\/button><button type=\"button\" class=\"o \/th><th>금액<\/th><th>예산<\/th><th>메모<\/th><\/tr><\/thead><tbody>${values.map(x=>`<tr><td>${x.month}<\/td><td>${won(actual(kind,x.row,x.month))}<\/td><td>${won(x.row.budget)}<\/td><td>${esc(x.row.note)||'—'}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div><p class=\"sub\">항목을 수정하거나 다음 달로 가져와도 같은 항목의 기록이 이어집니다. 엑셀에서 목적이 달랐던 계좌는 별도 항목으로 보관했습니다.<\/p>`)}\nfunction diaryView(){const es=state.entries.filter(e=>e.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)),added=sum(es.filter(e=>e.mode==='add'&&e.kind==='expenses').map(e=>e.amount)),evidence=sum(es.filter(e=>e.mode==='evidence'&&e.kind==='expenses').map(e=>e.amount));return `<section class=\"card\"><div class=\"row\" style=\"justify-content:space-between\"><h2>건별 기록<\/h2><div class=\"row\">${button('거래 추가',`data-entry=\"new\" ${locked()?'disabled':''}`,true)}${button('무지출 기록',`id=\"zero-day\" ${locked()?'disabled':''}`)}<\/div><\/div><p class=\"notice\">원본 엑셀은 월별·분류별 합계이며 거래 날짜·상점 정보는 없습니다. 과거 금액을 풀어 적을 때는 ‘기존 합계의 증빙’, 새로운 거래를 더할 때는 ‘신규 거래’를 선택하세요.<\/p><div class=\"stats\">${metric('신규 지출',won(added),'월 지출 합계에 추가됨')}${metric('기존 지출 증빙',won(evidence),'월 지출 합계를 바꾸지 않음')}${metric('이번 달 기록',es.length+'건',`${new Set(es.map(e=>e.date)).size}일 기록`)}<\/div><div class=\"table-wrap\"><table><thead><tr><th>날짜<\/th><th>항목 / 구분<\/th><th>거래 내용<\/th><th>금액<\/th><th>반영 방식<\/th><th>관리<\/th><\/tr><\/thead><tbody>${es.map(e=>{const r=rows(e.kind).find(r=>r.id===e.rowId);return `<tr><td>${e.date}<\/td><td>${esc(r.item)}<div class=\"sub\">${esc(r.owner)} · ${KINDS[e.kind]}<\/div><\/td><td>${esc(e.item)}<div class=\"sub\">${esc(e.note)}<\/div><\/td><td>${won(e.amount)}<\/td><td>${e.mode==='add'?'신규 추가':'기존 합계 증빙'}<\/td><td>${button(locked()?'보기':'수정',`data-entry=\"${e.id}\"`)}<\/td><\/tr>`}).join('')||'<tr><td colspan=\"6\">아직 건별 기록이 없습니다. 원본 월 합계는 수입·지출 메뉴에서 확인하세요.<\/td><\/tr>'}<\/tbody><\/table><\/div><\/section><section class=\"card\"><h2>기존 월 합계의 상세 기록 현황<\/h2><div class=\"table-wrap\"><table><thead><tr><th>항목<\/th><th>기 \">메모<textarea name=\"note\" rows=\"3\" maxlength=\"500\">${esc(e.note)}<\/textarea><\/label><\/div><div class=\"actions\">${button('거래 저장','',true)}${id!=='new'?button('삭제',`type=\"button\" data-delete-entry=\"${e.id}\"`):''}<\/div><\/fieldset><\/form>`)}\nfunction entryOptions(kind,id){return rows(kind).map(r=>`<option value=\"${r.id}\" ${r.id===id?'selected':''}>${esc(r.item)} · ${esc(r.owner)} (기본 ${won(r.amount)})<\/option>`).join('')}\nfunction reportView(){const m=current(),all=Object.keys(state.months).sort(),old=state.months[comparison],a=netReady()?net():null,b=netReady(comparison)?net(comparison):null;return `<section class=\"card\"><div class=\"row\" style=\"justify-content:space-between\"><h2>월별 전체 흐름<\/h2>${button('새 달 시작','id=\"new-month\"',true)}<\/div><div class=\"table-wrap\"><table><thead><tr><th>월<\/th><th>순자산<\/th><th>수입<\/th><th>지출<\/th><th>수입 − 지출<\/th><th>정산<\/th><\/tr><\/thead><tbody>${all.map(date=>`<tr><td>${button(date,`data-month=\"${date}\"`)}<\/td><td>${netReady(date)?won(net(date)):'잔액 확인 필요'}<\/td><td>${won(total('income',date))}<\/td><td>${won(total('expenses',date))}<\/td><td>${won(total('income',date)-total('expenses',date))}<\/td><td>${state.months[date].done.every(Boolean)?'마감':'진행 중'}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div><p class=\"sub\">미입력 금액은 소계에서 제외합니다. 월별 잔액은 기간 합계로 더하지 않습니다.<\/p><\/section>${!m?'':`<section class=\"card\"><div class=\"row\"><h2>${month}와 비교할 월<\/h2><select id=\"comparison\" style=\"width:180px\">${selectOptions(all,comparison)}<\/select><\/div><div class=\"stats\">${metric('순자산 차이',a!==null&&b!==null?won(a-b):'잔액 확인 필요')}${metric('수입 차이',old?won(total('income')-total('income',comparison)):'비교 자료 없음')}${metric('지출 차이',old?won(total('expenses')-total('expenses',comparison)):'비교 자료 없음')}<\/div><div class=\"table-wrap\"><table><thead><tr><th>지출 분류<\/th><th>${comparison}<\/th><th>${month}<\/th><th>변화<\/th><\/tr><\/thead><tbody>${[...new Set([...rows('expenses'),...rows('expenses',comparison)].map(r=>r.category))].map(c=>{const val=date=>sum(rows('expenses',date).filter(r=>r.category===c).map(r=>actual('expenses',r,date)||0)),v=val(month),p=val(comparison);return `<tr><td>${esc(c)}<\/td><td>${won(p)}<\/td><td>${won(v)}<\/td><td>${won(v-p)}<\/td><\/tr>`}).join('')}<\/tbody><\/table><\/div><\/section><section class=\"card\"><h2>월말 메모와 함께 확인<\/h2><form id=\"month-note\"><label>이번 달 돌아보기<textarea name=\"note\" maxlength=\"500\" rows=\"3\" ${locked()?'disabled':''}>${esc(m.note)}<\/textarea><\/label><div class=\"actions\">${button('메모 저장',locked()?'disabled':'')}<\/div><\/form><p class=\"notice\">자산·부채·수입·지출의 미입력 항목을 채우고 확인합니다. 두 사람 모두 확인하면 이 달은 수정 잠금 상태가 됩니다.<\/p>${state.names.map((n,i)=>`<div class=\"check\"><span>${esc(n)} · ${m.done[i]?'확인 완료':'확인 대기'}<\/span>${button(m.done[i]?'확인 완료':'정산 확인',`data-confirm=\"${i}\" ${m.done[i]?'disabled':''}`)}<\/div>`).join('')}${m.done.some(Boolean)?`<div class=\"actions\">${button('확인 해제 / 수정 다시 열기','id=\"reopen\"')}<\/div>`:''}<\/section>`}`}\nfunction newMonthView(){return `<section class=\"card\"><h2>${month}은 아직 시작하지 않았어요.<\/h2><p>이전 월의 항목을 가져와 새 달의 예산과 잔액을 관리하세요. 수입·지출 실제 금액과 거래 내역은 복사하지 않습니다.<\/p><div class=\"actions\">${button('이 달 시작하기','id=\"new-month\"',true)}${button('기존 월 보기','data-go=\"report\"')}<\/div><\/section>`}\nfunction newMonthDialog(){const all=Object.keys(state.months).sort();openDialog(`<h2>새 달 시작<\/h2><form id=\"new-month-form\"><div class=\"fields\"><label>새로 관리할 월<input name=\"month\" type=\"month\" min=\"1900-01\" max=\"9999-12\" required value=\"${current()?nextMonth(month):month}\"><\/label><label>항목을 가져올 월<select name=\"from\">${selectOptions(all,current()?month:all.at(-1))}<\/select><\/label><label class=\"wide check-inline\"><input type=\"checkbox\" name=\"carry\" checked>자산·부채 잔액을 확인 대기 상태로 가져오기<\/label><\/div><p class=\"notice\">자산·부채 항목과 고정비 목록을 가져옵니다. 수입·지출·고정비의 예산은 기존 예산 또는 실제 금액으로 채우고, 실제 금액은 미입력으로 시작합니다. 거래 상세와 정산 확인은 복사하지 않습니다.<\/p><div class=\"actions\">${button('새 달 만들기','',true)}<\/div><\/form>`)}\nfunction nextMonth(m){const [y,n]=m.split('-').map(Number);return n===12?`${y+1}-01`:`${y}-${String(n+1).padStart(2,'0')}`}\nfunction makeMonth(target,from,carry){if(!validMonth(target)||state.months[target]||!state.months[from])throw Error('새로운 월과 가져올 월을 확인해 주세요.');const m=clone(state.months[from]);for(const k of Object.keys(KINDS))m[k]=m[k].map(r=>({...r,amount:['assets','debts'].includes(k)&&carry?actual(k,r,from):null,budget:['assets','debts'].includes(k)?null:r.budget??actual(k,r,from),confirmed:false,note:'',source:`${from}에서 항목 가져옴`}));Object.assign(m,{done:[false,false],inputDone:[false,false,false],note:'',source:'직접 시작',title:'',review:false,reviewNote:''});state.months[target]=m;month=target;return m}\nfunction houseView(){const start=net(),income=total('income'),monthly=Math.round(income*state.rate/100),future=start+monthly*120,remaining=Math.max(0,state.homePrice-start),duration=monthly?Math.ceil(remaining/monthly):null;return `<section class=\"card hero\"><span>내집마련 목표<\/span><div class=\"big\">${won(state.homePrice)}<\/div><p class=\"sub\">${netReady()?`현재 순자산 ${won(start)}`:'선택한 월의 자산·부채 잔액을 먼저 확인하세요.'}<\/p><\/section><section class=\"card\"><h2>10년 순자산 목표<\/h2><p><strong>${won(state.goal)}<\/strong> · 현재 ${netReady()?pct(start,state.goal):'잔액 확인 필요'}<\/p><progress max=\"100\" value=\"${netReady()?Math.max(0,Math.min(100,start/state.goal*100)):0}\"><\/progress><\/section><section class=\"card\"><h2>저축률로 그려보는 10년<\/h2><form id=\"projection-form\"><label>월 수입 중 저축률 (%)<input name=\"rate\" type=\"number\" min=\"0\" max=\"100\" step=\"1\" required value=\"${state.rate}\"><\/label><div class=\"actions\">${button('계산하기','',true)}<\/div><\/form><div class=\"stats\">${metric('매월 저축 가정',won(monthly))}${metric('10년 뒤 순자산',netReady()?won(future):'잔액 확인 필요')}${metric('목표까지',!netReady()?'잔액 확인 필요':remaining===0?'목표 달성':duration===null?'수입·저축률 필요':`${Math.floor(duration/12)}년 ${duration%12}개월`)}<\/div><p class=\"notice\">선택한 월 수입 ${won(income)}을
