  .chart-controls select{min-height:44px}
  .chart-grid{gap:24px}
  .data-chart{min-height:0;max-height:190px}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .actions button{width:100%;min-width:0;padding:10px 8px}
  .actions button:last-child:nth-child(odd){grid-column:1/-1}
  .table-wrap{margin:0 -18px;padding:0 18px;max-height:70vh}
  dialog{width:calc(100vw - 20px);max-height:92vh;padding:18px;border-radius:20px}
  footer{padding:4px 2px 18px;line-height:1.5}

  body>main{padding:18px 16px 48px}

  body>main .amount-input{font-size:30px}
}

onth\" type=\"month\" min=\"1900-01\" max=\"9999-12\" required value=\"${current()?nextMonth(month):month}\"><\/label><label>항목을 가져올 월<select name=\"from\">${selectOptions(all,current()?month:all.at(-1))}<\/select><\/label><label class=\"wide check-inline\"><input type=\"checkbox\" name=\"carry\" checked>자산·부채 잔액을 확인 대기 상태로 가져오기<\/label><\/div><p class=\"notice\">자산·부채 항목과 고정비 목록을 가져옵니다. 수입·지출·고정비의 예산은 기존 예산 또는 실제 금액으로 채우고, 실제 금액은 미입력으로 시작합니다. 거래 상세와 정산 확인은 복사하지 않습니다.<\/p><div class=\"actions\">${button('새 달 만들기','',true)}<\/div><\/form>`)}\nfunction nextMonth(m){const [y,n]=m.split('-').map(Number);return n===12?`${y+1}-01`:`${y}-${String(n+1).padStart(2,'0')}`}\nfunction makeMonth(target,from,carry){if(!validMonth(target)||state.months[target]||!state.months[from])throw Error('새로운 월과 가져올 월을 확인해 주세요.');const m=clone(state.months[from]);for(const k of Object.keys(KINDS))m[k]=m[k].map(r=>({...r,amount:['assets','debts'].includes(k)&&carry?actual(k,r,from):null,budget:['assets','debts'].includes(k)?null:r.budget??actual(k,r,from),confirmed:false,note:'',source:`${from}에서 항목 가져옴`}));Object.assign(m,{done:[false,false],inputDone:[false,false,false],note:'',source:'직접 시작',title:'',review:false,reviewNote:''});state.months[target]=m;month=target;return m}\nfunction houseView(){const start=net(),income=total('income'),monthly=Math.round(income*state.rate/100),future=start+monthly*120,remaining=Math.max(0,state.homePrice-start),duration=monthly?Math.ceil(remaining/monthly):null;return `<section class=\"card hero\"><span>내집마련 목표<\/span><div class=\"big\">${won(state.homePrice)}<\/div><p class=\"sub\">${netReady()?`현재 순자산 ${won(start)}`:'선택한 월의 자산·부채 잔액을 먼저 확인하세요.'}<\/p><\/section><section class=\"card\"><h2>10년 순자산 목표<\/h2><p><strong>${won(state.goal)}<\/strong> · 현재 ${netReady()?pct(start,state.goal):'잔액 확인 필요'}<\/p><progress max=\"100\" value=\"${netReady()?Math.max(0,Math.min(100,start/state.goal*100)):0}\"><\/progress><\/section><section class=\"card\"><h2>저축률로 그려보는 10년<\/h2><form id=\"projection-form\"><label>월 수입 중 저축률 (%)<input name=\"rate\" type=\"number\" min=\"0\" max=\"100\" step=\"1\" required value=\"${state.rate}\"><\/label><div class=\"actions\">${button('계산하기','',true)}<\/div><\/form><div class=\"stats\">${metric('매월 저축 가정',won(monthly))}${metric('10년 뒤 순자산',netReady()?won(future):'잔액 확인 필요')}${metric('목표까지',!netReady()?'잔액 확인 필요':remaining===0?'목표 달성':duration===null?'수입·저축률 필요':`${Math.floor(duration/12)}년 ${duration%12}개월`)}<\/div><p class=\"notice\">선택한 월 수입 ${won(income)}을 기준으로 합니다. 수익률 0%, 집값 고정이며 세금·대출·물가를 반영하지 않습니다. 순자산 전체를 매입 자금으로 가정한 단순 계산입니다.<\/p><\/section>`}\nfunction captureSourceMonth(date){const live=state.months[date];if(!live)return null;const copy=clone(live);for(const kind of Object.keys(KINDS))copy[kind]=live[kind].map(row=>({...clone(row),amount:actual(kind,row,date),confirmed:actual(kind,row,date)!==null,source:`HTML 입력 기준 · ${date}`}));return copy}\nfunction sourceMonth(date){return state.sourceOverrides?.[date]||captureSourceMonth(date)}\nfunction sourceChanges(date){const base=state.sourceOverrides?.[date],live=state.months[date];if(!base||!live)return 0;let count=0;for(const kind of Object.keys(KINDS)){const ids=new Set([...base[kind].map(r=>r.id),...live[kind].map(r=>r.id)]);for(const id of ids){const a=base[kind].find(r=>r.id===id),b=live[kind].find(r=>r.id===id),value=b?actual(kind,b,date):null;if(!a||!b||a.amount!==value||a.category!==b.category||a.item!==b.item||a.owner!==b.owner||a.purpose!==b.purpose)count++}}return count}\nfunction sourceDialog(){const months=Object.keys(state.months).sort();openDialog(`<h2>원본 데이터 변경<\/h2><p>선택한 월의 현재 HTML 입력값을 원본 기준으로 저장합니다.<\/p><form id=\"source-baseline-form\"><div class=\"fields\">${months.map(date=>`<label class=\"check-inline\"><input type=\"checkbox\" name=\"source-month\" value=\"${date}\" ${date===month?'checked':''}>${date}${state.sourceOverrides?.[date]?' · 기준본 저장됨':''}<\/label>`).join('')}<\/div><p class=\"notice\">선택한 월만 갱신합니다. 이후 입력값을 수정해  min=\"1\" max=\"100000000000000\" required value=\"${state.goal}\"><\/label><label>내집마련 목표 (원)<input type=\"number\" name=\"homePrice\" min=\"1\" max=\"100000000000000\" required value=\"${state.homePrice}\"><\/label><\/div><p class=\"sub\">정산 확인 이름을 바꿔도 원본의 구분(신랑·신부·공급관리)은 유지됩니다.<\/p><div class=\"actions\">${button('설정 저장','',true)}<\/div><\/form><\/section>${typeof cloudSyncView==='function'?cloudSyncView():''}<section class=\"card\"><h2>백업과 복원<\/h2><p>모든 월의 항목·예산·거래 상세·메모·정산 상태를 JSON으로 보관합니다.<\/p><div class=\"actions\">${button('현재 기록 내보내기','id=\"export\"',true)}${button('백업 가져오기','id=\"import\"')}${button('이전 HTML의 기록 백업','id=\"export-old\"')}${button('화면 인쇄 / PDF','id=\"print\"')}<\/div><input id=\"backup-file\" type=\"file\" accept=\".json,application/json\" hidden><p class=\"notice\">클라우드 동기화를 사용하더라도 JSON 백업을 정기적으로 보관하세요. 이 HTML에는 실제 자산 정보가 들어 있으므로 파일 공유에 주의하세요.<\/p><\/section><section class=\"card\"><h2>월별 관리 순서<\/h2><ol><li>새 달 시작으로 전월의 계좌와 분류를 가져옵니다.<\/li><li>자산·부채 잔액을 확인하고 각 항목을 저장합니다.<\/li><li>수입·지출·고정비의 예산과 실제 금액을 입력합니다.<\/li><li>거래 상세에서 신규 거래 또는 기존 합계의 증빙을 기록합니다.<\/li><li>월별 비교를 확인한 후 두 사람이 정산을 마감합니다.<\/li><\/ol><\/section>`}\nfunction csvExport(kind){const headers=['월','분류','항목','구분','목적/업체','기본 금액','최종 실제','예산','메모','출처'];const safe=v=>{let s=String(v??'');if(/^[=+@\\-\\t\\r]/.test(s))s=\"'\"+s;return '\"'+s.replaceAll('\"','\"\"')+'\"'};const data=[headers,...filtered(kind).map(r=>[month,r.category,r.item,r.owner,r.purpose,r.amount,actual(kind,r),r.budget,r.note,r.source])].map(row=>row.map(safe).join(',')).join('\\r\\n');download('\\ufeff'+data,`${month}_${KINDS[kind]}.csv`,'text/csv;charset=utf-8')}\ndocument.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.go){go(d.go);return}if(d.month){setMonth(d.month);return}if(d.add){rowDialog(d.add);return}if(d.edit){rowDialog(d.edit,d.id);return}if(d.history){historyDialog(d.history,d.id);return}if(d.csv){csvExport(d.csv);return}if(d.entry){entryDialog(d.
