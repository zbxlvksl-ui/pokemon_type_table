/* Mobile-first polish for phone Chrome. Desktop layout remains unchanged. */
@media (max-width:650px){
  :root{--mobile-key:#007e72;--mobile-key-dark:#075f58;--mobile-tint:#e7f4f1;--mobile-surface:#fff}
  html{scroll-padding-top:132px}
  body{background:#f3f7f8;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font-size:16px}
  button{min-height:44px}

  .shell aside{
    position:sticky;top:0;z-index:20;height:auto;padding:11px 14px 0;
    border:0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);
    box-shadow:0 5px 18px rgba(21,44,50,.07);backdrop-filter:blur(12px)
  }
  .shell aside>.eyebrow{display:none}
  .shell aside .brand{font-size:20px;line-height:1.1;white-space:nowrap}
  .version-mark{margin:6px 0 0!important;padding:3px 7px!important;font-size:10px!important}
  .shell nav{
    display:flex;gap:6px;margin:8px -14px 0;padding:0 14px 10px;overflow-x:auto;
    scroll-snap-type:x proximity;scrollbar-width:none
  }
  .shell nav::-webkit-scrollbar{display:none}
  .shell nav button{
    flex:0 0 auto;min-height:40px;padding:8px 13px;border:1px solid transparent;
    border-radius:999px;font-size:13px;scroll-snap-align:start
  }
  .shell nav button.active{
    color:#fff;background:var(--mobile-key);border-color:var(--mobile-key);
    box-shadow:0 5px 12px rgba(0,126,114,.2)
  }

  .shell>main{padding:18px 14px 72px}
  .shell>main>header{
    display:grid;grid-template-columns:1fr;align-items:start;gap:12px;
    margin:0 0 16px;padding:0 2px
  }
  .shell>main>header h1{font-size:32px;line-height:1}
  .shell>main>header .sub{max-width:none;font-size:13px;line-height:1.45}
  .shell>main>header label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;text-align:left}
  .shell>main>header input{width:150px;min-height:44px;margin-top:0;padding:8px}

  .monthbar{
    display:grid;grid-template-columns:auto 1fr;gap:7px 9px;align-items:center;
    margin:0 0 14px;padding:12px;border:1px solid #cfe3e1;border-radius:16px;background:var(--mobile-tint)
  }
  .monthbar button{grid-column:1/-1;width:100%;margin:2px 0 0;background:#fff;border-color:#b9d5d2}
  .card,.stat{border-color:#d7e4e6;border-radius:20px;box-shadow:0 5px 18px rgba(21,44,50,.045)}
  .card{padding:18px;margin-bottom:14px}
  .card h2{font-size:21px;line-height:1.25;margin-bottom:15px}
  .stat{padding:16px}
  .hero{padding:22px;background:linear-gradient(145deg,var(--mobile-key-dark),#123e42)}
  .hero .big{font-size:31px;line-height:1.1}

  .chart-head{gap:14px;margin-bottom:16px}
  .chart-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
  .chart-controls label{min-width:0;font-size:12px}
  .chart-controls select{min-height:44px}
  .chart-grid{gap:24px}
  .data-chart{min-height:0;max-height:190px}
  .chart-key{gap:7px 12px;margin:10px 0}
  .chart-key span{font-size:12px}
  .bar-row{margin-bottom:14px}
  .bar-label{font-size:13px}
  .bar-track{height:10px}
  .big-number{font-size:30px;line-height:1.15;overflow-wrap:anywhere}
  .view-tabs{gap:7px;margin:0 -4px 16px;padding:4px;scrollbar-width:none}
  .view-tabs::-webkit-scrollbar{display:none}
  .view-tabs button{min-height:40px;padding:8px 12px;border-radius:999px;font-size:13px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .filters label{min-width:0}
  .filters .wide,.filters .check-inline{grid-column:1/-1}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .actions button{width:100%;min-width:0;padding:10px 8px}
  .actions button:last-child:nth-child(odd){grid-column:1/-1}
  .table-wrap{margin:0 -18px;padding:0 18px;max-height:70vh}
  dialog{width:calc(100vw - 20px);max-height:92vh;padding:18px;border-radius:20px}
  footer{padding:4px 2px 18px;line-height:1.5}

  body>main{padding:18px 16px 48px}
  body>main>header{margin:0 0 18px;padding:18px;border-radius:20px;background:var(--mobile-tint)}
  body>main>header h1{font-size:31px;line-height:1.05}
  body>main .context{padding:4px 2px 8px}
  body>main .steps{margin-top:14px}
  body>main .card{padding:20px}
  body>main .amount-input{font-size:30px}
}

;return `<tr><td>${esc(r.item)} · ${esc(r.owner)}<\/td><td>${won(r.amount)}<\/td><td>${won(ev)}<\/td><td class=\"${ev>(r.amount||0)?'negative':''}\">${r.amount===null?'기본 합계 미입력':won(r.amount-ev)}<\/td><\/tr>`}).join('')||'<tr><td colspan=\"4\">기존 합계의 증빙을 입력하면 항목별 남은 금액을 확인할 수 있어요.<\/td><\/tr>'}<\/tbody><\/table><\/div><\/section>`}\nfunction entryDialog(id,zero=false){const e=state.entries.find(e=>e.id===id)||{id:uid(),date:month===today().slice(0,7)?today():month+'-01',kind:'expenses',rowId:rows('expenses')[0]?.id||'',mode:'add',item:zero?'무지출 하루':'',amount:0,note:''};openDialog(`<h2>${id==='new'?'거래 추가':'거래 수정'}<\/h2><form id=\"entry-form\" data-id=\"${e.id}\"><fieldset ${locked()?'disabled':''}><div class=\"fields\"><label>날짜<input name=\"date\" type=\"date\" required value=\"${e.date}\" min=\"${month}-01\" max=\"${month}-${new Date(Number(month.slice(0,4)),Number(month.slice(5)),0).getDate()}\"><\/label><label>종류<select name=\"kind\" id=\"entry-kind\">${Object.entries({expenses:'지출',income:'수입'}).map(([v,l])=>`<option value=\"${v}\" ${e.kind===v?'selected':''}>${l}<\/option>`).join('')}<\/select><\/label><label class=\"wide\">연결할 월 항목<select name=\"rowId\" id=\"entry-row\" required>${entryOptions(e.kind,e.rowId)}<\/select><\/label><label class=\"wide\">반영 방식<select name=\"mode\"><option value=\"add\" ${e.mode==='add'?'selected':''}>신규 거래 — 월 합계에 금액 추가<\/option><option value=\"evidence\" ${e.mode==='evidence'?'selected':''}>기존 합계의 증빙 — 합계 그대로<\/option><\/select><\/label><label>상점·거래 내용<input name=\"item\" required maxlength=\"120\" value=\"${esc(e.item)}\"><\/label><label>금액 (원)<input name=\"amount\" type=\"number\" min=\"0\" max=\"100000000000000\" step=\"1\" required value=\"${e.amount}\"><\/label><label class=\"wide\">메모<textarea name=\"note\" rows=\"3\" maxlength=\"500\">${esc(e.note)}<\/textarea><\/label><\/div><div class=\"actions\">${button('거래 저장','',true)}${id!=='new'?button('삭제',`type=\"button\" data-delete-entry=\"${e.id}\"`):''}<\/div><\/fieldset><\/form>`)}\nfunction entryOptions(kind,id){return rows(kind).map(r=>`<option value=\"${r.id}\" ${r.id===id?'selected':''}>${esc(r.item)} · ${esc(r.owner)} (기본 ${won(r.amount)})<\/option>`).join('')}\nfunction reportView(){const m=current(),all=Object.keys(state.months).sort(),old=state.months[comparison],a=netReady()?net():null,b=netReady(comparison)?net(comparison):null;return `<section class=\"card\"><div class=\"row\" style=\"justify-content:space-between\"><h2>월별 전체 흐름<\/h2>${button('새 달 시작','id=\"new-month\"',true)}<\/div><div class=\"table-wrap\"><table><thead><tr><th>월<\/th><th>순자산<\/th><th>수입<\/th><th>지출<\/th><th>수입 − 지출<\/th><th>정산<\/th><\/tr><\/thead><tbody>${all.map(date=>`<tr><td>${button(date,`data-month=\"${date}\"`)}<\/td><td>${netReady(date)?won(net(date)):'잔액 확인 필요'}<\/td><td>${won(total('income',date))}<\/td><td>${won(total('expenses',date))}<\/td><td>${won(total('income',date)-total('expenses',date))}<\/td><td>${state.months[date].done.every(Boolean)?'마감':'진행 중'}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div><p class=\"sub\">미입력 금액은 소계에서 제외합니다. 월별 잔액은 기간 합계로 더하지 않습니다.<\/p><\/section>${!m?'':`<section class=\"card\"><div class=\"row\"><h2>${month}와 비교할 월<\/h2><select id=\"comparison\" style=\"width:180px\">${selectOptions(all,comparison)}<\/select><\/div><div class=\"stats\">${metric('순자산 차이',a!==null&&b!==null?won(a-b):'잔액 확인 필요')}${metric('수입 차이',old?won(total('income')-total('income',comparison)):'비교 자료 없음')}${metric('지출 차이',old?won(total('expenses')-total('expenses',comparison)):'비교 자료 없음')}<\/div><div class=\"table-wrap\"><table><thead><tr><th>지출 분류<\/th><th>${comparison}<\/th><th>${month}<\/th><th>변화<\/th><\/tr><\/thead><tbody>${[...new Set([...rows('expenses'),...rows('expenses',comparison)].map(r=>r.category))].map(c=>{const val=date=>sum(rows('expenses',date).filter(r=>r.category===c).map(r=>actual('expenses',r,date)||0)),v=val(month),p=val(comparison);return `<tr><td>${esc(c)}<\/td><td>${won(p)}<\/td><td>${won(v)}<\/td><td>${won(v-p)}<\/t ard\"><h2>목표와 정산 확인 이름<\/h2><form id=\"settings-form\"><div class=\"fields\">${state.names.map((n,i)=>`<label>정산 확인 ${i+1}<input name=\"name${i}\" required maxlength=\"20\" value=\"${esc(n)}\"><\/label>`).join('')}<label>10년 순자산 목표 (원)<input type=\"number\" name=\"goal\" min=\"1\" max=\"100000000000000\" required value=\"${state.goal}\"><\/label><label>내집마련 목표 (원)<input type=\"number\" name=\"homePrice\" min=\"1\" max=\"100000000000000\" required value=\"${state.homePrice}\"><\/label><\/div><p class=\"sub\">정산 확인 이름을 바꿔도 원본의 구분(신랑·신부·공급관리)은 유지됩니다.<\/p><div class=\"actions\">${button('설정 저장','',true)}<\/div><\/form><\/section>`}\nfunction settingsView(){return `${typeof cloudSyncView==='function'?cloudSyncView():''}<section class=\"card\"><h2>백업과 복원<\/h2><p>모든 월의 항목·예산·거래 상세·메모·정산 상태를 JSON으로 보관합니다.<\/p><div class=\"actions\">${button('현재 기록 내보내기','id=\"export\"',true)}${button('백업 가져오기','id=\"import\"')}${button('이전 HTML의 기록 백업','id=\"export-old\"')}${button('화면 인쇄 / PDF','id=\"print\"')}<\/div><input id=\"backup-file\" type=\"file\" accept=\".json,application/json\" hidden><p class=\"notice\">클라우드 동기화를 사용하더라도 JSON 백업을 정기적으로 보관하세요. 이 HTML에는 실제 자산 정보가 들어 있으므로 파일 공유에 주의하세요.<\/p><\/section><section class=\"card\"><h2>월별 관리 순서<\/h2><ol><li>새 달 시작으로 전월의 계좌와 분류를 가져옵니다.<\/li><li>자산·부채 잔액을 확인하고 각 항목을 저장합니다.<\/li><li>수입·지출·고정비의 예산과 실제 금액을 입력합니다.<\/li><li>거래 상세에서 신규 거래 또는 기존 합계의 증빙을 기록합니다.<\/li><li>월별 비교를 확인한 후 두 사람이 정산을 마감합니다.<\/li><\/ol><\/section>`}\nfunction csvExport(kind){const headers=['월','분류','항목','구분','목적/업체','기본 금액','최종 실제','예산','메모','출처'];const safe=v=>{let s=String(v??'');if(/^[=+@\\-\\t\\r]/.test(s))s=\"'\"+s;return '\"'+s.replaceAll('\"','\"\"')+'\"'};const data=[headers,...filtered(kind).map(r=>[month,r.category,r.item,r.owner,r.purpose,r.amount,actual(kind,r),r.budget,r.note,r.source])].map(row=>row.map(safe).join(',')).join('\\r\\n');download('\\ufeff'+data,`${month}_${KINDS[kind]}.csv`,'text/csv;charset=utf-8')}\ndocument.addEventListener('click',e=>{const assetRow=e.target.closest('[data-asset-id]');if(assetRow&&!e.target.closest('button')){selectedAssetId=assetRow.dataset.assetId;render();return}const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.inputMonth){setMonth(d.inputMonth);openMonthlyInput();return}if(d.go){go(d.go);return}if(d.month){setMonth(d.month);return}if(d.add){rowDialog(d.add);return}if(d.edit){rowDialog(d.edit,d.id);return}if(d.history){historyDialog(d.history,d.id);return}if(d.csv){csvExport(d.csv);return}if(d.entry){entryDialog(d.entry);return}if(d.deleteRow){if(linked(d.deleteRow,d.id).length){alert('연결된 거래가 있습니다. 거래를 먼저 옮기거나 삭제하세요.');return}if(confirm('이 달의 항목을 삭제할까요? 다른 월의 기록은 유지됩니다.')){if(commit(()=>{current()[d.deleteRow]=rows(d.deleteRow).filter(r=>r.id!==d.id)}))$('#editor').close()}return}if(d.deleteEntry){if(confirm('거래를 삭제할까요? 신규 거래라면 월 합계에서도 빠집니다.')){if(commit(()=>{state.entries=state.entries.filter(e=>e.id!==d.deleteEntry)}))$('#editor').close()}return}if(d.confirm!==undefined){const incomplete=['assets','debts','income','expenses'].some(k=>!complete(k));if(incomplete){alert('자산·부채·수입·지출의 미입력 항목을 저장하고, 가져온 잔액을 확인해 주세요.');return}const i=Number(d.confirm);if(!confirm(`${state.names[i]} 이름으로 ${month} 정산을 확인할까요?`))return;current().done[i]=true;persist();render();return}\n if(b.id==='close-dialog')$('#editor').close();if(b.id==='new-month')newMonthDialog();if(b.id==='zero-day')entryDialog('new',true);if(b.id==='reopen'&&confirm('정산 확인을 해제하고 수정을 다시 열까요?')){current().done=[false,false];persist();render()}if(b.id==='export')download(state,`우리의_자산노트_상세_${today()}.json`);if(b.id==='change-source')sourceDialog();if(b.id==='export-source'){const data={basis:'HTML 입력 기준',exportedAt:new Date().toISOString(),months:Object.fromEntries(Object.keys(state.months).sort().map(date=>[date,sourceMonth(date)]))};download(data,`우리의_자산노트_HTML원본_${today()}.json`);}if(b.id==='import')$('#backup-file').click();if(b.id==='print')window.print();if(b.id==='export-old'){try{const raw=localStorage.getItem(OLDKEY);if(!raw){toast('이 브라우저에는 이전 버전 기록이 없습니다.');return}download(raw,'이전_자산노트_백업.json','application/octet-stream')}catch{toast('저장 공간을 읽지 못했습니다.')}}});\ndocument.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f),read=n=>String(d.get(n)||'').trim(),number=n=>read(n)===''?null:Number(read(n));\n try{if(f.id==='filter-form'){filters={owner:read('owner'),category:read('category'),q:read('q'),hideZero:d.has('hideZero')};render();return}\n if(f.id==='row-form'){const kind=f.dataset.kind,id=f.dataset.id,old=rows(kind).find(r=>r.id===id),amount=number('amount'),budget=number('budget');if((amount!==null&&!money(amount))||(budget!==null&&!money(budget)))throw Error('금액을 확인해 주세요.');if(!read('item')||!read('category')||!read('owner'))throw Error('분류·항목·구분을 입력해 주세요.');const record={id,category:read('category'),item:read('item'),owner:read('owner'),purpose:read('purpose'),amount,budget,note:read('note'),source:old?.source||'직접 입력',confirmed:amount!==null};if(commit(()=>{const i=rows(kind).findIndex(r=>r.id===id);if(i<0)current()[kind].push(record);else current()[kind][i]=record}))$('#editor').close();return}\n if(f.id==='entry-form'){const entry={id:f.dataset.id,date:read('date'),kind:read('kind'),rowId:read('rowId'),mode:read('mode'),item:read('item'),amount:number('amount'),note:read('note')};if(!validDate(entry.date)||!entry.date.startsWith(month)||!money(entry.amount)||!entry.item)throw Error('날짜·내용·금액을 확인하세요.');const row=rows(entry.kind).find(r=>r.id===entry.rowId);if(!row)throw Error('연결할 항목을 먼저 추가하세요.');if(entry.mode==='evidence'){const evidence=sum(linked(entry.kind,row.id).filter(e=>e.mode==='evidence'&&e.id!==entry.id).map(e=>e.amount))+entry.amount;if(row.amount===null)throw Error('기존 월 기본 합계를 먼저 입력하세요.');if(evidence>row.amount&&!confirm('증빙 합계가 월 기본 합계를 넘습니다. 차이를 남겨두고 저장할까요?'))return}if(commit(()=>{const i=state.entries.findIndex(e=>e.id===entry.id);if(i<0)state.entries.push(entry);else state.entries[i]=entry}))$('#editor').close();return}\n if(f.id==='new-month-form'){const before=clone(state),oldmonth=month;try{makeMonth(read('month'),read('from'),d.has('carry'));validate(state)}catch(err){state=before;month=oldmonth;throw err}persist();$('#editor').close();go('assets');return}\n if(f.id==='month-note'){commit(()=>current().note=read('note'));return}\n if(f.id==='source-baseline-form'){const selected=d.getAll('source-month').filter(validMonth);if(!selected.length)throw Error('원본으로 저장할 월을 하나 이상 선택하세요.');state.sourceOverrides=state.sourceOverrides&&typeof state.sourceOverrides==='object'?state.sourceOverrides:{};for(const date of selected){const captured=captureSourceMonth(date);if(captured)state.sourceOverrides[date]=captured}if(persist()){toast(`${selected.length}개 월의 현재 입력값을 원본으로 저장했습니다.`);$('#editor').close();render()}return}\n if(f.id==='settings-form'){const n=[read('name0'),read('name1')];if(n.some(x=>!x))throw Error('이름을 입력하세요.');const g=number('goal'),h=number('homePrice');if(!money(g)||!g||!money(h)||!h)throw Error('목표 금액을 확인하세요.');state.names=n;state.goal=g;state.homePrice=h;if(persist())toast('설정을 저장했습니다.');render();return}\n if(f.id==='projection-form'){state.rate=Number(read('rate'));persist();render();return}\n }catch(err){alert(err.message)}});\ndocument.addEventListener('change',async e=>{const el=e.target;if(el.id==='month'&&el.validity.valid)setMonth(el.value);if(el.id==='comparison'){comparison=el.value;render()}if(el.id==='source-type'){sourceType=el.value;render()}if(el.id==='entry-kind')$('#entry-row').innerHTML=entryOptions(el.value,'');if(el.id==='backup-file'&&el.files[0]){try{if(el.files[0].size>15*1024*1024)throw Error('15MB 이하의 백업을 선택하세요.');const next=JSON.parse(await el.files[0].text());validate(next);if(!confirm('현재 상세 관리 기록을 이 백업으로 교체할까요? 현재 기록은 먼저 내보내 두세요.'))return;state=next;removeLegacyJointAccount(state);rawBroken='';month=Object.keys(state.months).sort().at(-1)||'2026-03';const ok=persist();render();if(ok)toast('복원했습니다.')}catch(err){alert('복원하지 못했습니다. '+err.message)}}});\ndocument.addEventListener('toggle',e=>{if(e.target.id==='input-progress')inputProgressOpen=e.target.open},true);\ndocument.addEventListener('keydown',e=>{const row=e.target.closest('[data-asset-id]');if(row&&!e.target.closest('button')&&['Enter',' '].includes(e.key)){e.preventDefault();selectedAssetId=row.dataset.assetId;render()}});\nrender();\n\n\nconst INCOME_ANALYSIS_NOTE='<p class=\"sub income-analysis-note\">공금은 ‘기타 소득’만 수입에 포함합니다. ‘공동 생활비’는 신랑·신부의 수입에서 이체된 금액이므로 수입 분석에서 제외합니다.<\/p>';\nconst CHART_COLORS=['#3182f6','#f04452','#03b26c','#fe9800','#8b5cf6','#14b8a6'];\nconst DIMENSIONS={owner:'사람',category:'분류'};\nfunction chartStep(range,count=4){const raw=Math.max(1,range/count),power=10**Math.floor(Math.log10(raw)),unit=raw/power,rounded=unit<=1?1:unit<=2?2:unit<=5?5:10;return rounded*power}\nfunction chartScale(values,top,bottom){\n const finite=values.filter(Number.isFinite),min=finite.length?Math.min(...finite):0,max=finite.length?Math.max(...finite):0;\n const padding=Math.max(1,max===min?Math.abs(min)*.01:(max-min)*.08);\n const lower=min>=0?Math.max(0,min-padding):min-padding,upper=max<=0?Math.min(0,max+padding):max+padding;\n const step=chartStep(upper-lower,5),lo=lower,hi=Math.max(lo+step,upper),first=Math.ceil(lo/step)*step;\n const ticks=Array.from({length:Math.floor((hi-first)/step)+1},(_,i)=>first+i*step);\n return {lo,hi,step,ticks,y:value=>bottom-(value-lo)/(hi-lo)*(bottom-top)};\n}\nfunction chartTick(value,step=1){const absolute=Math.abs(value),unit=absolute>=100000000?100000000:absolute>=10000?10000:1,suffix=unit===100000000?'억':unit===10000?'만':'';return (value/unit).toLocaleString('ko-KR',{maximumFractionDigits:Math.max(0,Math.ceil(Math.log10(unit/step)))})+suffix}\nfunction chartAxis(scale,left,right,format=value=>chartTick(value,scale.step)){return scale.ticks.map(value=>`<g><line x1=\"${left}\" x2=\"${right}\" y1=\"${scale.y(value)}\" y2=\"${scale.y(value)}\" stroke=\"#e5e8eb\" stroke-dasharray=\"3 4\"/><text x=\"${left-8}\" y=\"${scale.y(value)+4}\" text-anchor=\"end\" fill=\"#8b95a1\" font-size=\"11\">${format(value)}<\/text><\/g>`).join('')}\nfunction chartPoint(x,y,r,color,title){return `<g><circle class=\"chart-hit\" cx=\"${x}\" cy=\"${y}\" r=\"12\" fill=\"transparent\" ${historyTooltip(title)}><\/circle><circle cx=\"${x}\" cy=\"${y}\" r=\"${r}\" fill=\"${color}\" pointer-events=\"none\"/><\/g>`}\nfunction viewTabs(items,active,attr){return `<div class=\"view-tabs\" role=\"tablist\">${items.map(([key,label])=>`<button role=\"tab\" aria-selected=\"${key===active}\" class=\"${key===active?'selected':''}\" data-${attr}=\"${key}\">${label}<\/button>`).join('')}<\/div>`}\nfunction groupName(row,dimension){return dimension==='item'?`${row.item}${row.owner?` · ${row.owner}`:''}`:row[dimension]||'미지정'}\nfunction groupedSeries(kind,dimension){const months=Object.keys(state.months).sort(),maps=months.map(m=>{const out={};for(const row of analysisRows(kind,m)){const key=groupName(row,dimension);out[key]=(out[key]||0)+(actual(kind,row,m)||0)}return out}),keys=[...new Set(maps.flatMap(x=>Object.keys(x)))],ranked=keys.map(key=>({key,total:sum(maps.map(x=>Math.abs(x[key]||0)))})).sort((a,b)=>b.total-a.total).slice(0,6).map(x=>x.key);return {months,series:ranked.map(key=>({key,values:maps.map(x=>x[key]||0)}))}}\n// Allocate across all months, so filtering dates never changes a series color.\nfunction chartColor(kind,dimension,label){\n const SERIES_COLORS=['#2563eb','#ea580c','#059669','#9333ea','#db2777','#0891b2','#b45309','#4f46e5','#be123c','#4d7c0f','#0f766e','#a21caf','#475569','#ca8a04','#7c2d12','#0369a1','#6d28d9','#15803d','#9f1239','#334155'];\n const labels=new Set();\n for(const date of Object.keys(state.months)){\n  if(kind==='diary'){\n   for(const entry of state.entries.filter(e=>e.date.startsWith(date))){\n    const row=rows(entry.kind,date).find(r=>r.id===entry.rowId);\n    labels.add(dimension==='item'?entry.item:dimension==='owner'?row?.owner||'미지정':KINDS[entry.kind]);\n   }\n  }else for(const row of analysisRows(kind,date))labels.add(groupName(row,dimension));\n }\n const index=[...labels].sort().indexOf(label);\n if(index<0)return '#64748b';\n return SERIES_COLORS[index]||`hsl(${((index-SERIES_COLORS.length)*137.508+17)%360} 65% ${index%2?38:52}%)`;\n}\nfunction trendChart(kind,dimension){const {months,series}=groupedSeries(kind,dimension);if(!months.length||!series.length)return '<p class=\"empty\">표시할 기록이 없습니다.<\/p>';const w=720,h=250,left=72,right=18,top=18,bottom=42,scale=chartScale(series.flatMap(s=>s.values),top,h-bottom),x=i=>left+i*(w-left-right)/Math.max(1,months.length-1),color=s=>chartColor(kind,dimension,s.key);return `<svg class=\"data-chart\" viewBox=\"0 0 ${w} ${h}\" role=\"img\" aria-label=\"${KINDS[kind]} ${DIMENSIONS[dimension]}별 월간 추이\">${chartAxis(scale,left,w-right)}${series.map(s=>`<polyline points=\"${s.values.map((v,i)=>`${x(i)},${scale.y(v)}`).join(' ')}\" fill=\"none\" stroke=\"${color(s)}\" stroke-width=\"3\" ${historyTooltip(`${s.key}\\n${months.map((m,i)=>`${m}: ${won(s.values[i])}`).join('\\n')}`)}/>${s.values.map((v,i)=>chartPoint(x(i),scale.y(v),4,color(s),`${months[i]} · ${s.key}: ${won(v)}`)).join('')}`).join('')}${months.map((m,i)=>`<text x=\"${x(i)}\" y=\"${h-12}\" text-anchor=\"middle\" fill=\"#64767b\" font-size=\"12\">${m.slice(2)}<\/text>`).join('')}<\/svg><div class=\"chart-key\">${series.map(s=>`<span ${historyTooltip(`${s.key}\\n${months.map((m,i)=>`${m}: ${won(s.values[i])}`).join('\\n')}`)}><i style=\"background:${color(s)}\"><\/i>${esc(s.key)}<\/span>`).join('')}<\/div><p class=\"sub\">전체 기간 합계가 큰 상위 ${series.length}개를 표시합니다. 같은 항목은 월이 달라도 같은 색으로 표시됩니다.<\/p>`}\nfunction compositionChart(kind,dimension,date=month){const map={};for(const row of analysisRows(kind,date)){const key=groupName(row,dimension);map[key]=(map[key]||0)+(actual(kind,row,date)||0)}const list=Object.entries(map).sort((a,b)=>b[1]-a[1]),grand=sum(list.map(x=>x[1]));if(!list.length)return '<p class=\"empty\">표시할 기록이 (v),5,color(s.key),`${months[i]} · ${s.key}\\n${won(v)} · ${pct(v,values[i])}`)).join('')}`).join('');\n }\n const labels=months.map((date,i)=>`<text x=\"${historyChartMode==='ratio'?left+(right-left)/months.length*(i+.5):x(i)}\" y=\"248\" text-anchor=\"middle\" fill=\"#64767b\" font-size=\"12\">${date.slice(2)}<\/text>`).join('');\n return `<p class=\"sub history-scroll-hint\">차트가 화면보다 넓으면 좌우로 스크롤해 확인하세요. 항목에 마우스를 올리거나 선택하면 금액과 비율을 볼 수 있습니다.<\/p><div class=\"history-chart-scroll\"><svg class=\"history-chart\" style=\"min-width:${w}px\" viewBox=\"0 0 ${w} ${h}\" role=\"img\" aria-label=\"${historyChartMode==='ratio'?'월별 항목 비중':'월별 항목 추이'}\">${axis}${marks}${labels}<\/svg><\/div><div class=\"chart-key history-key\">${series.map(s=>`<span ${historyTooltip(`${s.key}\\n기간 합계 ${won(sum(s.values))} · ${pct(sum(s.values),sum(values))}`)}><i style=\"background:${color(s.key)}\"><\/i>${esc(s.key)}<\/span>`).join('')}<\/div>`;\n}\nfunction settlementPie(data,kind){\n const grand=sum(data.values),list=data.series.map(s=>({key:s.key,value:sum(s.values)})).filter(s=>s.value>0);\n if(!grand)return '<p class=\"empty\">합계가 0원이어서 파이 그래프를 표시할 수 없습니다.<\/p>';\n let angle=-Math.PI/2;\n const slices=list.map(s=>{\n  const start=angle,share=s.value/grand;angle+=share*Math.PI*2;\n  const color=chartColor(kind,historyDimension,s.key),tip=historyTooltip(`${data.months[0]} · ${s.key}\\n${won(s.value)} · ${pct(s.value,grand)}`);\n  if(list.length===1)return `<circle cx=\"160\" cy=\"160\" r=\"138\" fill=\"${color}\" ${tip}/>`;\n  return `<path d=\"M160 160 L${160+138*Math.cos(start)} ${160+138*Math.sin(start)} A138 138 0 ${share>.5?1:0} 1 ${160+138*Math.cos(angle)} ${160+138*Math.sin(angle)} Z\" fill=\"${color}\" stroke=\"white\" stroke-width=\"2\" ${tip}/>`;\n }).join('');\n return `<div class=\"settlement-pie\"><svg viewBox=\"0 0 320 320\" role=\"img\" aria-label=\"선택 월 항목별 비중 파이 그래프\">${slices}<\/svg><div class=\"chart-key\">${list.map(s=>`<span ${historyTooltip(`${data.months[0]} · ${s.key}
