ll,baseline='',dirty=false,busy=false,query='',newItem=null,counter=0,notice='',savedIds=new Set();\nfunction error(msg){$('#error').textContent=msg||''}function status(msg){$('#status').textContent=msg||''}\nfunction request(type,extra={}){return new Promise((resolve,reject)=>{if(!parentWindow||parentWindow.closed){reject(Error('대시보드 창이 닫혀 있습니다. 입력값을 보관한 뒤 대시보드에서 입력 창을 다시 열어 주세요.'));return}const requestId=String(++counter),timer=setTimeout(()=>{pending.delete(requestId);reject(Error('대시보드에서 응답이 없습니다. 대시보드의 알림을 확인한 뒤 다시 시도해 주세요.'))},8000);pending.set(requestId,{resolve,reject,timer});parentWindow.postMessage({channel:CHANNEL,token,requestId,type,month:selectedMonth,...extra},'*')})}\nwindow.addEventListener('message',e=>{const m=e.data;if(e.source!==parentWindow||!m||m.channel!==CHANNEL||m.token!==token)return;if(m.type==='changed'){if(dirty){status('대시보드에 변경 사항이 있습니다. 저장 시 최신 기록과 확인합니다.');return}if(!busy)refresh(false).catch(e=>error(e.message));return}const p=pending.get(m.requestId);if(!p)return;clearTimeout(p.timer);pending.delete(m.requestId);if(m.ok)p.resolve(m);else{const err=Error(m.error||'저장하지 못했습니다.');err.snapshot=m.snapshot;p.reject(err)}});\nconst records=()=>snapshot?.data?.[kind]?.filter(r=>r.owner===owner)||[];\nconst currentRow=()=>records().find(r=>r.id===rowId);\nconst additions=r=>snapshot.entries.filter(e=>e.kind===kind&&e.rowId===r.id&&e.mode==='add').reduce((s,e)=>s+e.amount,0);\nconst value=r=>r.amount===null?(additions(r)||null):r.amount+additions(r);\nconst signature=r=>JSON.stringify({row:r,entries:snapshot.entries.filter(e=>e.kind===kind&&e.rowId===r.id)});\nconst closed=()=>snapshot?.data?.done.every(Boolean);\nfunction discard(){return !dirty||confirm('아직 저장하지 않은 입력을 버리고 이동할까요?')}\nasync function refresh(redraw=true){const res=await request('get');snapshot=res.snapshot;if(redraw||!dirty){if(step===4&&rowId){const r=currentRow();if(r)baseline=signature(r);else{step=3;rowId=null}}render()}}\nfunction render(){error('');$('#context').innerHTML=step>1?`<div class=\"context\"><div><span class=\"badge\">${selectedMonth}<\/span> <strong>${esc(owner)}<\/strong><\/div><button class=\"small-link\" data-action=\"context\">월·입력자 변경<\/button><\/div>`:'';document.querySelectorAll('.steps span').forEach((x,i)=>x.className=i<step?'on':'');$('#app').innerHTML=({1:setupView,2:kindView,3:listView,4:amountView,5:newView}[step])();if(notice){status(notice);notice=''}window.scrollTo(0,0)}\nfunction setupView(){return `<section class=\"card\"><p class=\"sub\">1단계 · 누구의 몇 월 내역인가요?<\/p><h2>월과 입력자를 선택하세요<\/h2><form id=\"setup\"><label>입력할 월<input name=\"month\" type=\"month\" min=\"1900-01\" max=\"9999-12\" required value=\"${selectedMonth}\"><\/label><label>입력자<\/label><div class=\"choices\">${['신랑','신부'].map(p=>`<button type=\"button\" class=\"choice ${owner===p?'selected':''}\" aria-pressed=\"${owner===p}\" data-owner=\"${p}\"><strong>${p}<\/strong><span>${p} 명의 항목만 입력<\/span><\/button>`).join('')}<\/div><button type=\"button\" class=\"small-link\" style=\"margin-top:12px\" data-owner=\"공급관리\">${owner==='공급관리'?'✓ ':''}공동 내역(공급관리) 입력<\/button><div class=\"actions\"><button class=\"primary\">다음 →<\/button><\/div><\/form><\/section>`}\nfunction kindView(){if(!snapshot.data)return `<section class=\"card\"><h2>${selectedMonth}을 시작할까요?<\/h2><p>이 달은 아직 입력 전입니다. 이전 월의 항목을 준비하고 실제 금액은 비워 두겠습니다.<\/p><label>항목을 가져올 월<select id=\"copy-from\">${snapshot.months.filter(m=>m<selectedMonth).reverse().map(m=>`<option>${m}<\/option>`).join('')}<\/select><\/label><div class=\"notice\">신랑·신부·공동 항목을 함께 준비합니다. 이전 달의 실제 금액과 거래는 복사하지 않습니다.<\/div><div class=\"actions\"><button data-action=\"context\">돌아가기<\/button><button class=\"primary\" data-action=\"create-month\">새 달 준비하기<\/button><\/div><\/section>`;return `<section class=\"card\"><p class=\"sub\">2단계 · 어떤 내역을 입력할까요?<\/p><h2>한 종류씩 입력해요<\/h2>${closed()?'<div class=\"notice warning\">마감된 달입니다. 대시보드에서 정산 마감을 해제하면 입력할 수 있어요.<\/div>':''}<div class=\"choices\">${Object.entries(kinds).map(([k,label])=>{const rr=snapshot.data[k].filter(r=>r.owner===owner),count=rr.filter(r=>r.amount!==null&&r.confirmed).length;return `<button class=\"choice\" data-kind=\"${k}\"><strong>${label}<\/strong><span>${k==='income'?'급여·기타 소득':k==='expenses'?'식비·쇼핑·생활비':k==='assets'?'은행·적금·투자 잔액':'대출 등 남은 금액'}<\/span><span>${count} / ${rr.length}개 입력됨<\/span><\/button>`}).join('')}<\/div><p class=\"sub\" style=\"margin-top:20px\">입력값은 ${owner}의 항목에만 반영됩니다.<\/p><\/section>`}\nfunction listView(){const rr=records().filter(r=>[r.item,r.category,r.purpose].join(' ').includes(query));return `<section class=\"card\"><p class=\"sub\">3단계 · ${kinds[kind]} 항목 선택<\/p><h2>${owner}의 ${kinds[kind]}<\/h2><label>항목 찾기<input id=\"search\" value=\"${esc(query)}\" placeholder=\"항목·은행·목적으로 검색\"><\/label><div class=\"list\">${rr.map(r=>`<button class=\"item\" data-row=\"${r.id}\"><span><strong>${esc(r.item)}<\/strong><small>${esc(r.category)}${r.purpose?' · '+esc(r.purpose):''}<\/small><\/span><span class=\"amount\">${won(value(r))}<small>${r.confirmed?'입력됨':'입력·확인 필요'}<\/small><\/span><\/button>`).join('')||'<p class=\"sub\">해당 항목이 없습니다. 새 항목을 추가해 주세요.<\/p>'}<\/div><div class=\"actions\"><button data-action=\"kinds\">종류 다시 선택<\/button><button data-action=\"new-item\" ${closed()?'disabled':''}>＋ 새 항목<\/button><\/div><\/section>`}\nfunction amountView(){const r=currentRow(),fresh=!!newItem,item=newItem||r;if(!item)return listView();const rr=records(),index=rr.findIndex(x=>x.id===rowId),extra=r?additions(r):0;return `<section class=\"card\"><p class=\"sub\">4단계 · ${kinds[kind]} ${fresh?'새 항목':`${index+1} / ${rr.length}`}<\/p><div class=\"detail-title\">${esc(item.item)}<\/div><div class=\"meta\"><span>${esc(item.category)}<\/span>${item.purpose?`<span>${esc(item.purpose)}<\/span>`:''}<\/div><form id=\"amount-form\"><fieldset ${closed()?'disabled':''}><label for=\"amount\">${['assets','debts'].includes(kind)?'이번 달 말 잔액':'이 항목의 월 전체 '+kinds[kind]} (원)<\/label><input id=\"amount\" name=\"amount\" class=\"amo function homeView(){const m=current(),income=total('income'),expense=total('expenses'),prior=prevMonth(),ready=netReady(),fixed=rows('fixed').filter(r=>r.category!=='저축'),diffs=SOURCE.differences.filter(d=>d.month===month),top={};for(const r of rows('expenses'))top[r.category]=(top[r.category]||0)+(actual('expenses',r)||0);return `<section class="card hero"><div class="row" style="justify-content:space-between"><span>${month} 우리집 순자산</span><span class="badge">${ready?'입력 잔액 기준':'잔액 입력 진행 중'}</span></div><div class="big">${ready?won(net()):'잔액을 입력해 주세요'}</div><p class="sub">${ready&&netReady(prior)?`전월 대비 ${won(net()-net(prior))}`:'자산 합계에서 부채 합계를 차감합니다.'}</p><div class="actions">${button('계좌별 잔액 확인','data-go="assets"')}</div></section><div class="stats">${metric('수입 합계',won(income),complete('income')?'입력 완료':'미입력 항목 제외한 소계')}${metric('지출 합계',won(expense),'고정비를 별도로 더하지 않음')}${metric('수입 − 지출',won(income-expense),'순자산 증감과는 다릅니다')}</div>${diffs.length?`<div class="notice warning">원본 두 시트에 서로 다른 항목이 ${diffs.length}개 있습니다. 월별 시트 기준으로 가져왔습니다. ${button('차이 보기','data-go="source"')}</div>`:''}<div class="grid"><section class="card"><h2>순자산의 변화</h2>${chart()}</section><section class="card"><h2>어디에 많이 썼을까요?</h2>${Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([c,n])=>`<div class="check"><span>${esc(c)}</span><strong>${won(n)} <small class="muted">${pct(n,expense)}</small></strong></div>`).join('')}${button('전체 지출·예산 보기','data-go="expenses"')}</section></div><div class="grid"><section class="card"><h2>사람별 수입과 지출</h2><div class="table-wrap"><table><thead><tr><th>구분</th><th>수입</th><th>지출</th></tr></thead><tbody>${[...new Set([...rows('income'),...rows('expenses')].map(r=>r.owner))].map(o=>`<tr><td>${esc(o)}</td><td>${won(sum(rows('income').filter(r=>r.owner===o).map(r=>actual('income',r)||0)))}</td><td>${won(sum(rows('expenses').filter(r=>r.owner===o).map(r=>actual('expenses',r)||0)))}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><h2>고정비와 저축 점검</h2><div class="check"><span>고정비 (저축 제외)</span><strong>${won(sum(fixed.map(r=>r.amount||0)))}</strong></div><div class="check"><span>정기 저축</span><strong>${won(sum(rows('fixed').filter(r=>r.category==='저축').map(r=>r.amount||0)))}</strong></div><p class="sub">고정비는 별도 점검 목록입니다. 지출과 겹칠 수 있어 합계에 재가산하지 않습니다.</p>${button('항목별 점검','data-go="fixed"')}</section></div>`}

function ledgerView(kind){const list=filtered(kind),isStock=['assets','debts'].includes(kind),previous=prevMonth(),budgeted=list.filter(r=>r.budget!==null),budget=sum(budgeted.map(r=>r.budget)),value=sum(list.map(r=>actual(kind,r)||0));return `<section class="card"><div class="row" style="justify-content:space-between"><h2>${KINDS[kind]} <span class="badge">${list.length}개 항목</span></h2><div class="row">${button('항목 추가',`data-add="${kind}" ${locked()?'disabled':''}`,true)}${button('CSV 내보내기',`data-csv="${kind}"`)}</div></div><form id="filter-form" class="filters"><label>구분<select name="owner"><option value="">전체</option>${selectOptions([...new Set(rows(kind).map(r=>r.owner))],filters.owner)}</select></label><label>분류<select name="category"><option value="">전체</option>${selectOptions([...new Set(rows(kind).map(r=>r.category))],filters.category)}</select></label><label>검색<input name="q" value="${esc(filters.q)}" placeholder="항목·목적·메모"></label><label class="check-inline"><input name="hideZero" type="checkbox" ${filters.hideZero?'checked':''}>0원 숨기기</label>${button('필터 적용')}</form><div class="stats">${metric('현재 표시 항목 합계',won(value),`${list.filter(r=>actual(kind,r)===null||!r.confirmed).length}개 미입력·확인 대기`)}${metric(isStock?'전월 동일 항목 합계':'예산 합계',isStock?won(sum(list.map(r=>{const old=rows(kind,previous).find(o=>o.id===r.id);return old?actual(kind,old,previous)||0:0}))):won(budget),isStock?`${previous} 기준`:`${budgeted.length}/${list.length}개 예산 설정`)}${metric(isStock?'관리 방식':'예산 대비 실제',isStock?'월말 잔액':budgeted.length?won(sum(budgeted.map(r=>actual(kind,r)||0))-budget):'예산 미설정',isStock?'합산 기간 잔액은 더하지 않음':'예산을 설정한 항목끼리 비교')}</div><p class="notice">${isStock?'계좌·대출별 분류, 이름, 구분, 목적과 잔액을 관리합니다. 전월에서 가져온 잔액은 확인 전까지 전체 순자산 확정에 사용하지 않습니다.':kind==='fixed'?'월세·구독·보험·저축을 항목별로 점검합니다. 이 목록의 금액은 수입·지출에 자동 합산되지 않습니다.':'엑셀의 월 합계에 신규 거래만 더합니다. 기존 합계의 증빙으로 기록한 거래는 이중 합산하지 않습니다. 예산은 원본에 없어 처음에는 비어 있습니다.'}</p><div class="table-wrap"><table><thead><tr><th>분류 / 항목</th><th>구분</th><th>${kind==='fixed'?'업체':'목적'}</th><th>${isStock?'잔액':'실제 합계'}</th><th>${isStock?'전월 증감':'예산 / 차이'}</th><th>비중</th><th>관리</th></tr></thead><tbody>${list.map(r=>{const v=actual(kind,r),p=rows(kind,previous).find(x=>x.id===r.id),pv=p?actual(kind,p,previous):null;return `<tr><td><strong>${esc(r.item)}</strong><div class="sub">${esc(r.category)}${r.confirmed?'':' · 확인 대기'}</div>${r.note?`<div class="sub">${esc(r.note).slice(0,100)}</div>`:''}</td><td>${esc(r.owner)}</td><td>${esc(r.purpose)||'—'}</td><td class="amount"><strong>${won(v)}</strong></td><td class="amount">${isStock?v!==null&&pv!==null?won(v-pv):'비교 자료 없음':r.budget===null?'미설정':`${won(r.budget)}<div class="sub">차이 ${v===null?'미입력':won(v-r.budget)}</div>`}</td><td>${v===null?'—':pct(v,value)}</td><td><div class="row">${button(locked()?'상세':'수정',`data-edit="${kind}" data-id="${r.id}"`)}${button('추이',`data-history="${kind}" data-id="${r.id}"`)}</div></td></tr>`}).join('')||'<tr><td colspan="7">조건에 맞는 항목이 없습니다.</td></tr>'}</tbody></table></div></section>`}

function diaryView(){const es=state.entries.filter(e=>e.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)),added=sum(es.filter(e=>e.mode==='add'&&e.kind==='expenses').map(e=>e.amount)),evidence=sum(es.filter(e=>e.mode==='evidence'&&e.kind==='expenses').map(e=>e.amount));return `<section class="card"><div class="row" style="justify-content:space-between"><h2>건별 기록</h2><div class="row">${button('거래 추가',`data-entry="new" ${locked()?'disabled':''}`,true)}${button('무지출 기록',`id="zero-day" ${locked()?'disabled':''}`)}</div></div><p class="notice">원본 엑셀은 월별·분류별 합계이며 거래 날짜·상점 정보는 없습니다. 과거 금액을 풀어 적을 때는 ‘기존 합계의 증빙’, 새로운 거래를 더할 때는 ‘신규 거래’를 선택하세요.</p><div class="stats">${metric('신규 지출',won(added),'월 지출 합계에 추가됨')}${metric('기존 지출 증빙',won(evidence),'월 지출 합계를 바꾸지 않음')}${metric('이번 달 기록',es.length+'건',`${new Set(es.map(e=>e.date)).size}일 기록`)}</div><div class="table-wrap"><table><thead><tr><th>날짜</th><th>항목 / 구분</th><th>거래 내용</th><th>금액</th><th>반영 방식</th><th>관리</th></tr></thead><tbody>${es.map(e=>{const r=rows(e.kind).find(r=>r.id===e.rowId);return `<tr><td>${e.date}</td><td>${esc(r.item)}<div class="sub">${esc(r.owner)} · ${KINDS[e.kind]}</div></td><td>${esc(e.item)}<div class="sub">${esc(e.note)}</div></td><td>${won(e.amount)}</td><td>${e.mode==='add'?'신규 추가':'기존 합계 증빙'}</td><td>${button(locked()?'보기':'수정',`data-entry="${e.id}"`)}</td></tr>`}).join('')||'<tr><td colspan="6">아직 건별 기록이 없습니다. 원본 월 합계는 수입·지출 메뉴에서 확인하세요.</td></tr>'}</tbody></table></div></section><section class="card"><h2>기존 월 합계의 상세 기록 현황</h2><div class="table-wrap"><table><thead><tr><th>항목</th><th>기본 합계</th><th>입력한 증빙</th><th>아직 풀어 쓰지 않은 금액</th></tr></thead><tbody>${rows('expenses').filter(r=>linked('expenses',r.id).some(e=>e.mode==='evidence')).map(r=>{const ev=sum(linked('expenses',r.id).filter(e=>e.mode==='evidence').map(e=>e.amount));return `<tr><td>${esc(r.item)} · ${esc(r.owner)}</td><td>${won(r.amount)}</td><td>${won(ev)}</td><td class="${ev>(r.amount||0)?'negative':''}">${r.amount===null?'기본 합계 function entryDialog(id,zero=false){const e=state.entries.find(e=>e.id===id)||{id:uid(),date:month===today().slice(0,7)?today():month+'-01',kind:'expenses',rowId:rows('expenses')[0]?.id||'',mode:'add',item:zero?'무지출 하루':'',amount:0,note:''};openDialog(`<h2>${id==='new'?'거래 추가':'거래 수정'}</h2><form id="entry-form" data-id="${e.id}"><fieldset ${locked()?'disabled':''}><div class="fields"><label>날짜<input name="date" type="date" required value="${e.date}" min="${month}-01" max="${month}-${new Date(Number(month.slice(0,4)),Number(month.slice(5)),0).getDate()}"></label><label>종류<select name="kind" id="entry-kind">${Object.entries({expenses:'지출',income:'수입'}).map(([v,l])=>`<option value="${v}" ${e.kind===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="wide">연결할 월 항목<select name="rowId" id="entry-row" required>${entryOptions(e.kind,e.rowId)}</select></label><label class="wide">반영 방식<select name="mode"><option value="add" ${e.mode==='add'?'selected':''}>신규 거래 — 월 합계에 금액 추가</option><option value="evidence" ${e.mode==='evidence'?'selected':''}>기존 합계의 증빙 — 합계 그대로</option></select></label><label>상점·거래 내용<input name="item" required maxlength="120" value="${esc(e.item)}"></label><label>금액 (원)<input name="amount" type="number" min="0" max="100000000000000" step="1" required value="${e.amount}"></label><label class="wide">메모<textarea name="note" rows="3" maxlength="500">${esc(e.note)}</textarea></label></div><div class="actions">${button('거래 저장','',true)}${id!=='new'?button('삭제',`type="button" data-delete-entry="${e.id}"`):''}</div></fieldset></form>`)}

function reportView(){const m=current(),all=Object.keys(state.months).sort(),old=state.months[comparison],a=netReady()?net():null,b=netReady(comparison)?net(comparison):null;return `<section class="card"><div class="row" style="justify-content:space-between"><h2>월별 전체 흐름</h2>${button('새 달 시작','id="new-month"',true)}</div><div class="table-wrap"><table><thead><tr><th>월</th><th>순자산</th><th>수입</th><th>지출</th><th>수입 − 지출</th><th>정산</th></tr></thead><tbody>${all.map(date=>`<tr><td>${button(date,`data-month="${date}"`)}</td><td>${netReady(date)?won(net(date)):'잔액 확인 필요'}</td><td>${won(total('income',date))}</td><td>${won(total('expenses',date))}</td><td>${won(total('income',date)-total('expenses',date))}</td><td>${state.months[date].done.every(Boolean)?'마감':'진행 중'}</td></tr>`).join('')}</tbody></table></div><p class="sub">미입력 금액은 소계에서 제외합니다. 월별 잔액은 기간 합계로 더하지 않습니다.</p></section>${!m?'':`<section class="card"><div class="row"><h2>${month}와 비교할 월</h2><select id="comparison" style="width:180px">${selectOptions(all,comparison)}</select></div><div class="stats">${metric('순자산 차이',a!==null&&b!==null?won(a-b):'잔액 확인 필요')}${metric('수입 차이',old?won(total('income')-total('income',comparison)):'비교 자료 없음')}${metric('지출 차이',old?won(total('expenses')-total('expenses',comparison)):'비교 자료 없음')}</div><div class="table-wrap"><table><thead><tr><th>지출 분류</th><th>${comparison}</th><th>${month}</th><th>변화</th></tr></thead><tbody>${[...new Set([...rows('expenses'),...rows('expenses',comparison)].map(r=>r.category))].map(c=>{const val=date=>sum(rows('expenses',date).filter(r=>r.category===c).map(r=>actual('expenses',r,date)||0)),v=val(month),p=val(comparison);return `<tr><td>${esc(c)}</td><td>${won(p)}</td><td>${won(v)}</td><td>${won(v-p)}</td></tr>`}).join('')}</tbody></table></div></section><section class="card"><h2>월말 메모와 함께 확인</h2><form id="month-note"><label>이번 달 돌아보기<textarea name="note" maxlength="500" rows="3" ${locked()?'disabled':''}>${esc(m.note)}</textarea></label><div class="actions">${button('메모 저장',locked()?'disabled':'')}</div></form><p class="notice">자산·부채·수입·지출의 미입력 항목을 채우고 확인합니다. 두 사람 모두 확인하면 이 달은 수정 잠금 상태가 됩니다.</p>${state.names.map((n,i)=>`<div class="check"><span>${esc(n)} · ${m.done[i]?'확인 완료':'확인 대기'}</span>${button(m.done[i]?'확인 완료':'정산 확인',`data-confirm="${i}" ${m.done[i]?'disabled':''}`)}</div>`).join('')}${m.done.some(Boolean)?`<div class="actions">${button('확인 해제 / 수정 다시 열기','id="reopen"')}</div>`:''}</section>`}`}
function newMonthView(){return `<section class="card"><h2>${month}은 아직 시작하지 않았어요.</h2><p>이전 월의 항목을 가져와 새 달의 예산과 잔액을 관리하세요. 수입·지출 실제 금액과 거래 내역은 복사하지 않습니다.</p><div class="actions">${button('이 달 시작하기','id="new-month"',true)}${button('기존 월 보기','data-go="report"')}</div></section>`}
function newMonthDialog(){const all=Object.keys(state.months).sort();openDialog(`<h2>새 달 시작</h2><form id="new-month-form"><div class="fields"><label>새로 관리할 월<input name="month" type="month" min="1900-01" max="9999-12" required value="${current()?nextMonth(month):month}"></label><label>항목을 가져올 월<select name="from">${selectOptions(all,current()?month:all.at(-1))}</select></label><label class="wide check-inline"><input type="checkbox" name="carry" checked>자산·부채 잔액을 확인 대기 상태로 가져오기</label></div><p class="notice">자산·부채 항목과 고정비 목록을 가져옵니다. 수입·지출·고정비의 예산은 기존 예산 또는 실제 금액으로 채우고, 실제 금액은 미입력으로 시작합니다. 거래 상세와 정산 확인은 복사하지 않습니다.</p><div class="actions">${button('새 달 만들기','',true)}</div></form>`)}
function nextMonth(m){const [y,n]=m.split('-').map(Number);return n===12?`${y+1}-01`:`${y}-${String(n+1).padStart(2,'0')}`}
function makeMonth(target,from,carry){if(!validMonth(target)||state.months[target]||!state.months[from])throw Error('새로운 월과 가져올 월을 확인해 주세요.');const m=clone(state.months[from]);for(const k of Object.keys(KINDS))m[k]=m[k].map(r=>({...r,amount:['assets','debts'].includes(k)&&carry?actual(k,r,from):null,budget:['assets','debts'].includes(k)?null:r.budget??actual(k,r,from),confirmed:false,note:'',source:`${from}에서 항목 가져옴`}));Object.assign(m,{done:[false,false],note:'',source:'직접 시작',title:'',review:false,reviewNote:''});state.months[target]=m;month=target;return m}
function houseView(){const start=net(),income=total('income'),monthly=Math.round(income*state.rate/100),future=start+monthly*120,remaining=Math.max(0,state.homePrice-start),duration=monthly?Math.ceil(remaining/monthly):null;return `<section class="card hero"><span>내집마련 목표</span><div class="big">${won(state.homePrice)}</div><p class="sub">${netReady()?`현재 순자산 ${won(start)}`:'선택한 월의 자산·부채 잔액을 먼저 확인하세요.'}</p></section><section class="card"><h2>10년 순자산 목표</h2><p><strong>${won(state.goal)}</strong> · 현재 ${netReady()?pct(start,state.goal):'잔액 확인 필요'}</p><progress max="100" value="${netReady()?Math.max(0,Math.min(100,start/state.goal*100)):0}"></progress></section><section class="card"><h2>저축률로 그려보는 10년</h2><form id="projection-form"><label>월 수입 중 저축률 (%)<input name="rate" type="number" min="0" max="100" step="1" required value="${state.rate}"></label><div class="actions">${button('계산하기','',true)}</div></form><div class="stats">${metric('매월 저축 가정',won(monthly))}${metric('10년 뒤 순자산',netReady()?won(future):'잔액 확인 필요')}${metric('목표까지',!netReady()?'잔액 확인 필요':remaining===0?'목표 달성':duration===null?'수입·저축률 필요':`${Math.floor(duration/12)}년 ${duration%12}개월`)}</div><p class="notice">선택한 월 수입 ${won(income)}을 기준으로 합니다. 수익률 0%, 집값 고정이며 세금·대출·물가를 반영하지 않습니다. 순자산 전체를 매입 자금으로 가정한 단순 계산입니다.</p></section>`}
function sourceView(){const diffs=SOURCE.differences.filter(d=>d.month===month),src=sourceType==='monthly'?SOURCE.monthlySource[month]:SOURCE.reference[month];return `<section class="card"><h2>불러온 데이터의 기준</h2><p>실제 관리 데이터는 <strong>2025년 12월~2026년 3월의 월별 시트</strong>입니다. 2026년 4월 시트와 기간 별 데이터의 이후 월은 미입력·복사 데이터로 참고만 보관합니다.</p><p class="notice">월별 시트의 세부 항목 합계를 다시 계산하고 원본의 합계와 대조했습니다. ‘기간 별 데이터’와 다른 값은 자동으로 덮어쓰지 않았습니다. 원본의 ‘공급관리’ 명칭과 전세금 등 금액은 그대로 유지했습니다.</p><h3>${month} 원본 간 차이 · ${diffs.length}개</h3><div class="table-wrap"><table><thead><tr><th>종류 / 항목</th><th>월별 시트</th><th>기간 별 데이터</th><th>현재 관리값</th></tr></thead><tbody>${diffs.map(d=>{const r=d.monthly||d.period,live=rows(d.kind).find(x=>x.id===d.id);return `<tr><td>${KINDS[d.kind]} · ${esc(r.item)}<div class="sub">${esc(r.owner)} · ${esc(r.purpose)}</div></td><td>${d.monthly?won(d.monthly.amount):'항목 없음'}<div class="sub">${esc(d.monthly?.source)}</div></td><td>${d.period?won(d.period.amount):'항목 없음'}<div class="sub">${esc(d.period?.source)}</div></td><td>${live?won(actual(d.kind,live)):'관리 데이터 없음'}</td></tr>`}).join('')||'<tr><td colspan="4">이 월의 원본 간 차이가 없습니다.</td></tr>'}</tbody></table></div></section><section class="card"><div class="row"><h2>원본 항목 열람</h2><select id="source-type" style="width:220px"><option value="monthly" ${sourceType==='monthly'?'selected':''}>월별 시트</option><option value="period" ${sourceType==='period'?'selected':''}>기간 별 데이터</option></select>${button('원본 추출 JSON','id="export-source"')}</div><p class="sub">상단 기준 월을 바꾸면 2026년 12월까지 참고 자료를 조회할 수 있습니다. 아래는 편집 전 원본입니다.</p>${src?Object.keys(KINDS).map(k=>`<details><summary>${KINDS[k]} · ${src[k].length}개</summary><div class="table-wrap"><table><thead><tr><th>분류</th><th>항목</th><th>구분</th><th>목적·업체</th><th>원본 금액</th><th>셀</th></tr></thead><tbody>${src[k].map(r=>`<tr><td>${esc(r.category)}</td><td>${esc(r.item)}</td><td>${esc(r.owner)}</td><td>${esc(r.purpose)}</td><td>${won(r.amount)}</td><td>${esc(r.source)}</td></tr>`).join('')}</tbody></table></div></details>`).join(''):'<p class="empty">이 월의 원본 자료가 없습니다.</p>'}</section>`}
function settingsView(){return `<section class="card"><h2>목표와 정산 확인 이름</h2><form id="settings-form"><div class="fields">${state.names.map((n,i)=>`<label>정산 확인 ${i+1}<input name="name${i}" required maxlength="20" value="${esc(n)}"></label>`).join('')}<label>10년 순자산 목표 (원)<input type="number" name="goal" min="1" max="100000000000000" required value="${state.goal}"></label><label>내집마련 목표 (원)<input type="number" name="homePrice" min="1" max="100000000000000" required value="${state.homePrice}"></label></div><p class="sub">정산 확인 이름을 바꿔도 원본의 구분(신랑·신부·공급관리)은 유지됩니다.</p><div class="actions">${button('설정 저장','',true)}</div></form></section><section class="card"><h2>백업과 복원</h2><p>모든 월의 항목·예산·거래 상세·메모·정산 상태를 JSON으로 보관합니다.</p><div class="actions">${button('현재 기록 내보내기','id="export"',true)}${button('백업 가져오기','id="import"')}${button('이전 HTML의 기록 백업','id="export-old"')}${button('화면 인쇄 / PDF','id="print"')}</div><input id="backup-file" type="file" accept=".json,application/json" hidden><p class="notice">이 버전은 별도 저장 공간을 사용하므로 이전 HTML 기록을 덮어쓰지 않습니다. 이전 형식의 JSON은 이전 HTML에서 사용하세요. 이 HTML에는 실제 자산 정보가 들어 있으므로 파일을 전달하면 포함된 원본 데이터도 함께 전달됩니다.</p><p class="sub">로그인·서버 저장·기기 간 실시간 동기화는 포함되지 않습니다. 브라우저 데이터 삭제 전 반드시 백업하세요.</p></section><section class="card"><h2>월별 관리 순서</h2><ol><li>새 달 시작으로 전월의 계좌와 분류를 가져옵니다.</li><li>자산·부채 잔액을 확인하고 각 항목을 저장합니다.</li><li>수입·지출·고정비의 예산과 실제 금액을 입력합니다.</li><li>거래 상세에서 신규 거래 또는 기존 합계의 증빙을 기록합니다.</li><li>월별 비교를 확인한 후 두 사람이 정산을 마감합니다.</li></ol></section>`}
function csvExport(kind){const headers=['월','분류','항목','구분','목적/업체','기본 금액','최종 실제','예산','메모','출처'];const safe=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};const data=[headers,...filtered(kind).map(r=>[month,r.category,r.item,r.owner,r.purpose,r.amount,actual(kind,r),r.budget,r.note,r.source])].map(row=>row.map(safe).join(',')).join('\r\n');download('\ufeff'+data,`${month}_${KINDS[kind]}.csv`,'text/csv;charset=utf-8')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.go){go(d.go);return}if(d.month){setMonth(d.month);return}if(d.add){rowDialog(d.add);return}if(d.edit){rowDialog(d.edit,d.id);return}if(d.history){historyDialog(d.history,d.id);return}if(d.csv){csvExport(d.csv);return}if(d.entry){entryDialog(d.entry);return}if(d.deleteRow){if(linked(d.deleteRow,d.id).length){alert('연결된 거래가 있습니다. 거래를 먼저 옮기거나 삭제하세요.');return}if(confirm('이 달의 항목을 삭제할까요? 다른 월의 기록은 유지됩니다.')){if(commit(()=>{current()[d.deleteRow]=rows(d.deleteRow).filter(r=>r.id!==d.id)}))$('#editor').close()}return}if(d.deleteEntry){if(confirm('거래를 삭제할까요? 신규 거래라면 월 합계에서도 빠집니다.')){if(commit(()=>{state.entries=state.entries.filter(e=>e.id!==d.deleteEntry)}))$('#editor').close()}return}if(d.confirm!==undefined){const incomplete=['assets','debts','income','expenses'].some(k=>!complete(k));if(incomplete){alert('자산·부채·수입·지출의 미입력 항목을 저장하고, 가져온 잔액을 확인해 주세요.');return}const i=Number(d.confirm);if(!confirm(`${state.names[i]} 이름으로 ${month} 정산을 확인할까요?`))return;current().done[i]=true;persist();render();return}
 if(b.id==='close-dialog')$('#editor').close();if(b.id==='new-month')newMonthDialog();if(b.id==='zero-day')entryDialog('new',true);if(b.id==='reopen'&&confirm('정산 확인을 해제하고 수정을 다시 열까요?')){current().done=[false,false];persist();render()}if(b.id==='export')download(state,`우리의_자산노트_상세_${today()}.json`);if(b.id==='export-source')download(SOURCE,`부부_자산관리_원본추출.json`);if(b.id==='import')$('#backup-file').click();if(b.id==='print')window.print();if(b.id==='export-old'){try{const raw=localStorage.getItem(OLDKEY);if(!raw){toast('이 브라우저에는 이전 버전 기록이 없습니다.');return}download(raw,'이전_자산노트_백업.json','application/octet-stream')}catch{toast('저장 공간을 읽지 못했습니다.')}}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f),read=n=>String(d.get(n)||'').trim(),number=n=>read(n)===''?null:Number(read(n));
 try{if(f.id==='filter-form'){filters={owner:read('owner'),category:read('category'),q:read('q'),hideZero:d.has('hideZero')};render();return}
 if(f.id==='row-form'){const kind=f.dataset.kind,id=f.dataset.id,old=rows(kind).find(r=>r.id===id),amount=number('amount'),budget=number('budget');if((amount!==null&&!money(amount))||(budget!==null&&!money(budget)))throw Error('금액을 확인해 주세요.');if(!read('item')||!read('category')||!read('owner'))throw Error('분류·항목·구분을 입력해 주세요.');const record={id,category:read('category'),item:read('item'),owner:read('owner'),purpose:read('purpose'),amount,budget,note:read('note'),source:old?.source||'직접 입력',confirmed:amount!==null};if(commit(()=>{const i=rows(kind).findIndex(r=>r.id===id);if(i<0)current()[kind].push(record);else current()[kind][i]=record}))$('#editor').close();return}
 if(f.id==='entry-form'){const entry={id:f.dataset.id,date:read('date'),kind:read('kind'),rowId:read('rowId'),mode:read('mode'),item:read('item'),amount:number('amount'),note:read('note')};if(!validDate(entry.date)||!entry.date.startsWith(month)||!money(entry.amount)||!entry.item)throw Error('날짜·내용·금액을 확인하세요.');const row=rows(entry.kind).find(r=>r.id===entry.rowId);if(!row)throw Error('연결할 항목을 먼저 추가하세요.');if(entry.mode==='evidence'){const evidence=sum(linked(entry.kind,row.id).filter(e=>e.mode==='evidence'&&e.id!==entry.id).map(e=>e.amount))+entry.amount;if(row.amount===null)throw Error('기존 월 기본 합계를 먼저 입력하세요.');if(evidence>row.amount&&!confirm('증빙 합계가 월 기본 합계를 넘습니다. 차이를 남겨두고 저장할까요?'))return}if(commit(()=>{const i=state.entries.findIndex(e=>e.id===entry.id);if(i<0)state.entries.push(entry);else state.entries[i]=entry}))$('#editor').close();return}
 if(f.id==='new-month-form'){const before=clone(state),oldmonth=month;try{makeMonth(read('month'),read('from'),d.has('carry'));validate(state)}catch(err){state=before;month=oldmonth;throw err}persist();$('#editor').close();go('assets');return}
 if(f.id==='month-note'){commit(()=>current().note=read('note'));return}
 if(f.id==='settings-form'){const n=[read('name0'),read('name1')];if(n.some(x=>!x))throw Error('이름을 입력하세요.');const g=number('goal'),h=number('homePrice');if(!money(g)||!g||!money(h)||!h)throw Error('목표 금액을 확인하세요.');state.names=n;state.goal=g;state.homePrice=h;if(persist())toast('설정을 저장했습니다.');render();return}
 if(f.id==='projection-form'){state.rate=Number(read('rate'));persist();render();return}
 }catch(err){alert(err.message)}});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='month'&&el.validity.valid)setMonth(el.value);if(el.id==='comparison'){comparison=el.value;render()}if(el.id==='source-type'){sourceType=el.value;render()}if(el.id==='entry-kind')$('#entry-row').innerHTML=entryOptions(el.value,'');if(el.id==='backup-file'&&el.files[0]){try{if(el.files[0].size>15*1024*1024)throw Error('15MB 이하의 백업을 선택하세요.');const next=JSON.parse(await el.files[0].text());validate(next);if(!confirm('현재 상세 관리 기록을 이 백업으로 교체할까요? 현재 기록은 먼저 내보내 두세요.'))return;state=next;rawBroken='';month=Object.keys(state.months).sort().at(-1)||'2026-03';const ok=persist();render();if(ok)toast('복원했습니다.')}catch(err){alert('복원하지 못했습니다. '+err.message)}}});
render();

const CHART_COLORS=['#007e72','#b64c46','#557a95','#d49a3a','#765aa6','#4e8a68'];
const DIMENSIONS={owner:'사람',category:'분류',item:'항목'};
function viewTabs(items,active,attr){return `<div class="view-tabs" role="tablist">${items.map(([key,label])=>`<button role="tab" aria-selected="${key===active}" class="${key===active?'selected':''}" data-${attr}="${key}">${label}</button>`).join('')}</div>`}
function groupName(row,dimension){return dimension==='item'?`${row.item}${row.owner?` · ${row.owner}`:''}`:row[dimension]||'미지정'}
function groupedSeries(kind,dimension){const months=Object.keys(state.months).sort(),maps=months.map(m=>{const out={};for(const row of rows(kind,m)){const key=groupName(row,dimension);out[key]=(out[key]||0)+(actual(kind,row,m)||0)}return out}),keys=[...new Set(maps.flatMap(x=>Object.keys(x)))],ranked=keys.map(key=>({key,total:sum(maps.map(x=>Math.abs(x[key]||0)))})).sort((a,b)=>b.total-a.total).slice(0,6).map(x=>x.key);return {months,series:ranked.map(key=>({key,values:maps.map(x=>x[key]||0)}))}}
function trendChart(kind,dimension){const {months,series}=groupedSeries(kind,dimension);if(!months.length||!series.length)return '<p class="empty">표시할 기록이 없습니다.</p>';const max=Math.max(1,...series.flatMap(s=>s.values)),w=720,h=250,left=26,right=18,top=18,bottom=42,x=i=>left+i*(w-left-right)/Math.max(1,months.length-1),y=v=>top+(max-v)*(h-top-bottom)/max;return `<svg class="data-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${KINDS[kind]} ${DIMENSIONS[dimension]}별 월간 추이"><line x1="${left}" y1="${h-bottom}" x2="${w-right}" y2="${h-bottom}" stroke="#cbdadd"/>${series.map((s,j)=>`<polyline points="${s.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${CHART_COLORS[j]}" stroke-width="3"/>${s.values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${CHART_COLORS[j]}"><title>${months[i]} · ${s.key}: ${won(v)}</title></circle>`).join('')}`).join('')}${months.map((m,i)=>`<text x="${x(i)}" y="${h-12}" text-anchor="middle" fill="#64767b" font-size="12">${m.slice(2)}</text>`).join('')}</svg><div class="chart-key">${series.map((s,i)=>`<span><i style="background:${CHART_COLORS[i]}"></i>${esc(s.key)}</span>`).join('')}</div><p class="sub">전체 기간 합계가 큰 상위 ${series.length}개를 표시합니다. 점에 마우스를 올리면 정확한 금액을 볼 수 있어요.</p>`}
function compositionChart(kind,dimension,date=month){const map={};for(const row of rows(kind,date)){const key=groupName(row,dimension);map[key]=(map[key]||0)+(actual(kind,row,date)||0)}const list=Object.entries(map).sort((a,b)=>b[1]-a[1]),grand=sum(list.map(x=>x[1]));if(!list.length)return '<p class="empty">표시할 기록이 없습니다.</p>';const visible=list.slice(0,8),rest=sum(list.slice(8).map(x=>x[1]));if(rest)visible.push(['그 외',rest]);return `<div class="bar-chart" role="img" aria-label="${date} ${KINDS[kind]} ${DIMENSIONS[dimension]}별 구성">${visible.map(([label,value],i)=>`<div class="bar-row"><div class="bar-label"><span>${esc(label)}</span><strong>${won(value)} <small>${pct(value,grand)}</small></strong></div><div class="bar-track"><span style="width:${grand?Math.max(1,value/grand*100):0}%;background:${CHART_COLORS[i%CHART_COLORS.length]}"></span></div></div>`).join('')}</div>`}
function cashflowChart(){const months=Object.keys(state.months).sort(),series=[{key:'수입',values:months.map(m=>total('income',m))},{key:'지출',values:months.map(m=>total('expenses',m))}],max=Math.max(1,...series.flatMap(s=>s.values)),w=720,h=240,left=26,right=18,top=18,bottom=42,x=i=>left+i*(w-left-right)/Math.max(1,months.length-1),y=v=>top+(max-v)*(h-top-bottom)/max;return `<svg class="data-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="월별 수입과 지출 비교"><line x1="${left}" y1="${h-bottom}" x2="${w-right}" y2="${h-bottom}" stroke="#cbdadd"/>${series.map((s,j)=>`<polyline points="${s.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${CHART_COLORS[j]}" stroke-width="3"/>${s.values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${CHART_COLORS[j]}"><title>${months[i]} ${s.key}: ${won(v)}</title></circle>`).join('')}`).join('')}${months.map((m,i)=>`<text x="${x(i)}" y="${h-12}" text-anchor="middle" fill="#64767b" font-size="12">${m.slice(2)}</text>`).join('')}</svg><div class="chart-key"><span><i style="background:${CHART_COLORS[0]}"></i>수입</span><span><i style="background:${CHART_COLORS[1]}"></i>지출</span></div>`}
function chartPanel(kind,dimension,controls=false){return `<section class="card chart-panel"><div class="chart-head"><div><span class="eyebrow">${KINDS[kind]} 분석</span><h2>${DIMENSIONS[dimension]}별 흐름과 구성</h2></div>${controls?`<form id="chart-controls" class="chart-controls"><label>내역<select name="kind" id="chart-kind">${Object.entries(KINDS).map(([key,label])=>`<option value="${key}" ${key===kind?'selected':''}>${label}</option>`).join('')}</select></label><label>구분 기준<select name="dimension" id="chart-dimension">${Object.entries(DIMENSIONS).map(([key,label])=>`<option value="${key}" ${key===dimension?'selected':''}>${label}</option>`).join('')}</select></label></form>`:''}</div><div class="chart-grid"><div><h3>기간별 변화</h3>${trendChart(kind,dimension)}</div><div><h3>${month} 구성</h3>${compositionChart(kind,dimension)}</div></div></section>`}
function analysisView(){return `${chartPanel(chartKind,chartDimension,true)}<div class="grid"><section class="card"><h2>월별 수입과 지출</h2>${cashflowChart()}<div class="actions">${button('수입 항목 보기','data-go="income"')}${button('지출 항목 보기','data-go="expenses"')}</div></section><section class="card"><h2>${month} 자산에서 부채를 뺀 금액</h2><div class="big-number">${netReady()?won(net()):'잔액 확인 필요'}</div><div class="check"><span>자산</span><strong>${won(total('assets'))}</strong></div><div class="check"><span>부채</span><strong>${won(total('debts'))}</strong></div>${button('자산 항목 관리','data-go="assets"')}</section></div>`}
function ledgerHubView(){if(!current())return newMonthView();const tabs=[...Object.entries(KINDS),['diary','거래 상세']];return `${viewTabs(tabs,ledgerKind,'ledger-kind')}${ledgerKind==='diary'?`<section class="card"><h2>거래 상세의 월간 분포</h2>${compositionChart('expenses','category')}</section>${diaryView()}`:`${chartPanel(ledgerKind,ledgerKind==='assets'||ledgerKind==='debts'?'owner':'category')}${ledgerView(ledgerKind)}`}`}
function planningHubView(){const tabs=[['report','월별 비교·정산'],['house','내집마련·목표']];return `${viewTabs(tabs,planningView,'planning-view')}${planningView==='report'?`<section class="card"><h2>수입·지출 흐름</h2>${cashflowChart()}</section>${reportView()}`:`${chartPanel('assets','category')}${houseView()}`}`}
function adminHubView(){return `${viewTabs([['settings','설정·백업'],['source','원본 비교']],adminView,'admin-view')}${adminView==='settings'?settingsView():sourceView()}`}
function inputSummaryCharts(){if(!current())return '';const data=['income','expenses','assets','debts'].map(kind=>{const rr=rows(kind),done=rr.filter(r=>r.amount!==null&&r.confirmed).length;return [KINDS[kind],done,rr.length]});return `<section class="card"><h2>${month} 입력 진행률</h2><div class="progress-chart">${data.map(([label,done,all])=>`<div><div class="bar-label"><span>${label}</span><strong>${done} / ${all}</strong></div><progress max="${all||1}" value="${done}"></progress></div>`).join('')}</div><h3>사람별 자산 구성</h3>${compositionChart('assets','owner')}</section>`}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.ledgerKind){ledgerKind=b.dataset.ledgerKind;filters={owner:'',category:'',q:'',hideZero:false};render()}if(b.dataset.planningView){planningView=b.dataset.planningView;render()}if(b.dataset.adminView){adminView=b.dataset.adminView;render()}});
document.addEventListener('change',event=>{if(event.target.id==='chart-kind'){chartKind=event.target.value;render()}if(event.target.id==='chart-dimension'){chartDimension=event.target.value;render()}});

// The dashboard owns persistence. The child never assumes file:// storage is shared.
const inputWindows=new Map();
const INPUT_CHANNEL='asset-note-monthly-input-v1';
function inputSnapshot(selected){const m=validMonth(selected)?selected:month;return {month:m,months:Object.keys(state.months).sort(),data:state.months[m]?clone(state.months[m]):null,entries:clone(state.entries.filter(e=>e.date.startsWith(m)))};}
function inputView(){return `<section class="card"><span class="badge">별도 창에서 한 항목씩</span><h2 style="margin-top:16px">월별 수입·지출 내역 입력</h2><p>월과 신랑·신부를 선택한 뒤 수입, 지출, 자산, 부채를 차례로 입력하세요. 저장한 내용은 이 대시보드에 바로 반영됩니다.</p><div class="actions">${button('입력 창 열기','id="open-monthly-input"',true)}</div><div class="notice">① 월·입력자 선택 → ② 내역 종류 선택 → ③ 항목 선택 → ④ 금액 입력<br>각 항목을 저장한 뒤 다음 항목으로 이동할 수 있어요. 0원도 입력할 수 있고, 빈칸은 미입력으로 남습니다.</div><p class="sub">입력하는 동안 이 대시보드 창을 열어 두세요. 새 창이 차단되면 브라우저의 팝업 허용 후 다시 눌러 주세요. 입력 화면도 이 HTML 안에 들어 있어 다른 파일은 필요하지 않습니다.</p></section>${inputSummaryCharts()}`;}
function openMonthlyInput(){const token=uid(),html=JSON.parse(document.querySelector('#input-document').textContent),blobUrl=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'})),url=new URL(blobUrl);url.hash=new URLSearchParams({token,month}).toString();const win=window.open(url.href,'monthly-input-'+token,'popup,width=640,height=850,resizable=yes,scrollbars=yes');if(!win){URL.revokeObjectURL(blobUrl);toast('입력 창이 차단되었습니다. 팝업을 허용한 뒤 다시 열어 주세요.');return}inputWindows.set(win,token);win.focus();}
function notifyInputWindows(){for(const [win,token] of inputWindows){if(win.closed){inputWindows.delete(win);continue}win.postMessage({channel:INPUT_CHANNEL,token,type:'changed'},'*');}}
function inputSignature(kind,row,m){return JSON.stringify({row,entries:state.entries.filter(e=>e.date.startsWith(m)&&e.kind===kind&&e.rowId===row.id)});}
window.addEventListener('message',event=>{
 const request=event.data,token=inputWindows.get(event.source);if(!token||!request||request.channel!==INPUT_CHANNEL||request.token!==token||typeof request.requestId!=='string')return;
 const reply=(ok,payload)=>event.source.postMessage({channel:INPUT_CHANNEL,token,requestId:request.requestId,ok,...payload},'*');
 try{
  const selected=request.month;if(!validMonth(selected))throw Error('입력할 월을 확인하세요.');
  if(request.type==='get'){reply(true,{snapshot:inputSnapshot(selected)});return}
  if(storageProblem||rawBroken)throw Error('대시보드 저장 상태를 먼저 확인하세요. 현재 입력은 저장하지 않았습니다.');
  const before=clone(state),oldMonth=month;
  try{
   if(request.type==='create-month'){
    if(state.months[selected])throw Error('다른 창에서 이미 시작한 월입니다. 최신 내용을 불러와 주세요.');
    makeMonth(selected,request.from,false);month=oldMonth;
   }else if(request.type==='save-row'){
    const kind=request.kind,owner=request.owner;
    if(!['income','expenses','assets','debts'].includes(kind)||!['신랑','신부','공급관리'].includes(owner))throw Error('내역 종류와 입력자를 확인하세요.');
    const m=state.months[selected];if(!m)throw Error('먼저 이 달을 시작하세요.');if(m.done.every(Boolean))throw Error('마감된 달입니다. 대시보드의 월별 비교·정산에서 마감을 해제하세요.');
    const r=m[kind].find(r=>r.id===request.id),v=request.values;
    if(!v||(v.amount!==null&&!money(v.amount))||typeof v.note!=='string'||v.note.length>500)throw Error('금액과 메모를 확인하세요.');
    if(r){
     if(r.owner!==owner)throw Error('선택한 입력자의 항목이 아닙니다.');
     if(inputSignature(kind,r,selected)!==request.signature)throw Error('이 항목이 다른 창에서 변경되었습니다. 입력값을 복사해 두고 최신 값으로 다시 열어 주세요.');
     const extra=sum(linked(kind,r.id,selected).filter(e=>e.mode==='add').map(e=>e.amount));
     if(v.amount===null&&extra>0)throw Error('신규 거래가 연결되어 있어 미입력으로 바꿀 수 없습니다. 거래 상세에서 먼저 확인하세요.');
     if(v.amount!==null&&v.amount<extra)throw Error(`기록된 신규 거래 ${won(extra)}보다 월 전체 금액이 작습니다. 거래 상세에서 먼저 확인하세요.`);
     r.amount=v.amount===null?null:v.amount-extra;r.note=v.note;r.confirmed=v.amount!==null;
     if(v.budget!==undefined){if(!['income','expenses'].includes(kind)||(v.budget!==null&&!money(v.budget)))throw Error('예산을 확인하세요.');r.budget=v.budget;}
    }else{
     if(request.id||!request.newItem)throw Error('항목이 삭제되었거나 존재하지 않습니다. 목록을 새로 불러오세요.');
     const item=request.newItem;if(!['category','item','purpose'].every(k=>typeof item[k]==='string'&&item[k].length<=120)||!item.category.trim()||!item.item.trim())throw Error('새 항목의 분류와 이름을 확인하세요.');
     if(m[kind].some(r=>r.owner===owner&&r.category===item.category.trim()&&r.item===item.item.trim()&&r.purpose===item.purpose.trim()))throw Error('같은 항목이 이미 있습니다. 목록에서 해당 항목을 선택하세요.');
     m[kind].push({id:uid(),category:item.category.trim(),item:item.item.trim(),purpose:item.purpose.trim(),owner,amount:v.amount,budget:null,note:v.note,source:'월별 내역 입력 창',confirmed:v.amount!==null});
    }
    m.done=[false,false];
   }else throw Error('지원하지 않는 요청입니다.');
   validate(state);if(!persist())throw Error('브라우저에 저장하지 못했습니다. 입력값을 보관한 뒤 대시보드의 저장 상태를 확인하세요.');
  }catch(err){state=before;month=oldMonth;throw err}
  render();reply(true,{snapshot:inputSnapshot(selected)});
 }catch(err){reply(false,{error:err.message,snapshot:inputSnapshot(request.month)})}
});
document.addEventListener('click',event=>{if(event.target.closest('#open-monthly-input'))openMonthlyInput()});

</script></body></html>
