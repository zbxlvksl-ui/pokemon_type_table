lector(s),esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])),won=n=>n===null||n===undefined?'미입력':Math.round(n).toLocaleString('ko-KR')+'원';\nconst ITEM_COLORS=['#14b8a6','#fb7185','#38bdf8','#fbbf24','#a78bfa','#4ade80','#f472b6','#60a5fa','#fb923c','#22d3ee','#e879f9','#a3e635'];\nfunction itemColor(r){let h=2166136261;for(const c of `item|${r.item}`)h=Math.imul(h^c.charCodeAt(0),16777619);return ITEM_COLORS[(h>>>0)%ITEM_COLORS.length]}\nconst tag=r=>`<span class=\"item-tag\"><i><\/i>${esc(r.owner)}<\/span>`;\nconst kinds={income:'수입',expenses:'지출',assets:'자산',debts:'부채'},pending=new Map();\nlet selectedMonth=params.get('month')||new Date().toISOString().slice(0,7),owner='신랑',kind='income',step=1,snapshot=null,rowId=null,baseline='',dirty=false,busy=false,query='',newItem=null,counter=0,notice='',savedIds=new Set();\nfunction error(msg){$('#error').textContent=msg||''}function status(msg){$('#status').textContent=msg||''}\nlet flashTimer;function flash(type,msg){let bar=$('#flash');if(!bar){bar=document.createElement('div');bar.id='flash';bar.setAttribute('role','status');bar.setAttribute('aria-live','polite');document.body.prepend(bar)}clearTimeout(flashTimer);Object.assign(bar.style,{display:'block',position:'sticky',top:'0',zIndex:'1000',padding:'14px 18px',fontWeight:'700',fontSize:'14px',textAlign:'center',background:type==='error'?'#fff0f1':'#e8f3ff',color:type==='error'?'#f04452':'#2272eb',borderBottom:`4px solid ${type==='error'?'#f04452':'#3182f6'}`});bar.textContent=msg;flashTimer=setTimeout(()=>{bar.style.display='none'},5000)}\nfunction request(type,extra={}){return new Promise((resolve,reject)=>{if(!parentWindow||parentWindow.closed){reject(Error('대시보드 창이 닫혀 있습니다. 입력값을 보관한 뒤 대시보드에서 입력 창을 다시 열어 주세요.'));return}const requestId=String(++counter),timer=setTimeout(()=>{pending.delete(requestId);reject(Error('대시보드에서 응답이 없습니다. 대시보드의 알림을 확인한 뒤 다시 시도해 주세요.'))},8000);pending.set(requestId,{resolve,reject,timer});parentWindow.postMessage({channel:CHANNEL,token,requestId,type,month:selectedMonth,...extra},'*')})}\nwindow.addEventListener('message',e=>{const m=e.data;if(e.source!==parentWindow||!m||m.channel!==CHANNEL||m.token!==token)return;if(m.type==='changed'){if(dirty){status('대시보드에 변경 사항이 있습니다. 저장 시 최신 기록과 확인합니다.');return}if(!busy)refresh(false).catch(e=>error(e.message));return}const p=pending.get(m.requestId);if(!p)return;clearTimeout(p.timer);pending.delete(m.requestId);if(m.ok)p.resolve(m);else{const err=Error(m.error||'저장하지 못했습니다.');err.snapshot=m.snapshot;p.reject(err)}});\nconst records=()=>snapshot?.data?.[kind]?.filter(r=>r.owner===owner)||[];\nconst currentRow=()=>records().find(r=>r.id===rowId);\nconst additions=r=>snapshot.entries.filter(e=>e.kind===kind&&e.rowId===r.id&&e.mode==='add').reduce((s,e)=>s+e.amount,0);\nconst value=r=>r.amount===null?(additions(r)||null):r.amount+additions(r);\nconst signature=r=>JSON.stringify({row:r,entries:snapshot.entries.filter(e=>e.kind===kind&&e.rowId===r.id)});\nconst closed=()=>snapshot?.data?.done.every(Boolean);\nfunction discard(){return !dirty||confirm('아직 저장하지 않은 입력을 버리고 이동할까요?')}\nasync function refresh(redraw=true){const res=await request('get');snapshot=res.snapshot;if(redraw||!dirty){if(step===4&&rowId){const r=currentRow();if(r)baseline=signature(r);else{step=3;rowId=null}}render()}}\nfunction render(){error('');$('#context').innerHTML=step>1?`<div class=\"context\"><div><span class=\"badge\">${selectedMonth}<\/span> <strong>${esc(owner)}<\/strong><\/div><button class=\"small-link\" data-action=\"context\">월·입력자 변경<\/button><\/div>`:'';document.querySelectorAll('.steps span').forEach((x,i)=>x.className=i<step?'on':'');$('#app').innerHTML=({1:setupView,2:kindView,3:listView,4:amountView,5:newView}[step])();if(notice){status(notice);notice=''}window.scrollTo(0,0)}\nfunction setupView(){return `<section class=\"card\"><p class=\"sub\">1단계 · 누구의 몇 월 내역인가요?<\/p><h2>월과 입력자를 선택하세요<\/h2><form id=\"setup\"><label>입력할 월<input name=\"month\" type=\"month\" min=\"1900-01\" max=\"9999-12\" required value=\"${selectedMonth}\"><\/label><label>입력자<\/label><div class=\"choices\">${['신랑','신부'].map(p=>`<button type=\"button\" class=\"choice ${owner===p?'selected':''}\" aria-pressed=\"${owner===p}\" data-owner=\"${p}\"><strong>${p}<\/strong><span>${p} 명의 항목만 입력<\/span><\/button>`).join('')}<\/div><button type=\"button\" class=\"small-link\" style=\"margin-top:12px\" data-owner=\"공급관리\">${owner==='공급관리'?'✓ ':''}공동 내역(공급관리) 입력<\/button><div class=\"actions\"><button class=\"primary\">다음 →<\/button><\/div><\/form><\/section>`}\nfunction kindView(){if(!snapshot.data)return `<section class=\"card\"><h2>${selectedMonth}을 시작할까요?<\/h2><p>이전 월의 항목을 가져옵니다. 필요한 종류는 금액까지 함께 복사할 수 있어요.<\/p><label>항목을 가져올 월<select id=\"copy-from\">${snapshot.months.filter(m=>m<selectedMonth).reverse().map(m=>`<option>${m}<\/option>`).join('')}<\/select><\/label><fieldset><legend class=\"sub\" style=\"margin-top:18px\">금액까지 가져올 종류<\/legend><div class=\"copy-options\">${Object.entries(kinds).map(([k,label])=>`<label class=\"copy-option\"><input type=\"checkbox\" name=\"carry-kind\" value=\"${k}\"><span><strong>${label}<\/strong><small>금액 포함<\/small><\/span><\/label>`).join('')}<\/div><\/fieldset><div class=\"notice\">선택하지 않은 종류는 항목만 가져오고 금액은 0원부터 입력합니다. 거래 내역은 복사하지 않습니다.<\/div><div class=\"actions\"><button data-action=\"context\">돌아가기<\/button><button class=\"primary\" data-action=\"create-month\">새 달 준비하기<\/button><\/div><\/section>`;return `<section class=\"card\"><p class=\"sub\">2단계 · 어떤 내역을 입력할까요?<\/p><h2>한 종류씩 입력해요<\/h2>${closed()?'<div class=\"notice warning\">마감된 달입니다. 대시보드에서 정산 마감을 해제하면 입력할 수 있어요.<\/div>':''}<div class=\"choices\">${Object.entries(kinds).map(([k,label])=>{const rr=snapshot.data[k].filter(r=>r.owner===owner),count=rr.filter(r=>r.amount!==null&&r.confirmed).length;return `<button class=\"choice\" data-kind=\"${k}\"><strong>${label}<\/strong><span>${k==='income'?'급여·기타 소득':k==='expenses'?'식비·쇼핑·생활비':k==='assets'?'은행·적금·투자 잔액':'대출 등 남은 금액'}<\/span><span>${count} / ${rr.length}개 입력됨<\/span><\/button>`}).join('')}<\/div><p class=\"sub\" style=\"margin-top:20px\">입력값은 ${owner}의 항목에만 반영됩니다.<\/p><\/section>`}\nfunction listPreview(rr){if(!['income','expenses'].includes(kind))return '';const total=rr.reduce((s,r)=>s+(value(r)||0),0),done=rr.filter(r=>r.confirmed&&value(r)!==null).length,parts=rr.filter(r=>(value(r)||0)>0);return `<div class=\"input-preview\"><div class=\"input-preview-head\"><div><span>${owner} ${kinds[kind]} 입력 합계<\/span><strong>${won(total)}<\/strong><\/div><span>${done} / ${rr.length}개 입력<\/span><\/div><div class=\"input-preview-bar\" aria-label=\"항목별 입력 비율\">${parts.map(r=>`<i style=\"width:${total?value(r)/total*100:0}%;background:${itemColor(r)}\" title=\"${esc(r.item)} ${total?(value(r)/total*100).toFixed(1):0}%\"><\/i>`).join('')}<\/div><div class=\"input-preview-note\">각 항목의 금액이 입력 합계에서 차지하는 비율이에요.<\/div><\/div>`}\nfunction listView(){const all=records(),rr=all.filter(r=>[r.item,r.category,r.purpose].join(' ').includes(query)),total=all.reduce((s,r)=>s+(value(r)||0),0);return `<section class=\"card\"><p class=\"sub\">3단계 · ${kinds[kind]} 항목 선택<\/p><h2>${owner}의 ${kinds[kind]}<\/h2>${listPreview(all)}<label>항목 찾기<input id=\"search\" value=\"${esc(query)}\" placeholder=\"항목·은행·목적으로 검색\"><\/label><div class=\"list\">${rr.map(r=>{const v=value(r),ratio=total&&v!==null?`${(v/total*100).toFixed(1)}%`:'—';return `<button class=\"item\" style=\"--item-color:${itemColor(r)}\" data-row=\"${r.id}\"><span><strong>${esc(r.item)}<\/strong>${['income','expenses'].includes(kind)?`<small>${esc(r.category)}<\/small>${tag(r)}`:`<small>${esc(r.category)}${r.purpose?' · '+esc(r.purpose):''}<\/small>`}<\/span><span class=\"amount\">${won(v)}<small>${r.confirmed?'입력됨':'입력·확인 필요'}${['income','expenses'].includes(kind)?` · <span class=\"ratio\">${ratio}<\/span>`:''}<\/small><\/span><\/button>`}).join('')||'<p class=\"sub\">해당 항목이 없습니다. 새 항목을 추가해 주세요.<\/p>'}<\/div><div class=\"actions\"><button data-action=\"kinds\">종류 다시 선택<\/button><button data-action=\"new-item\" ${closed()?'disabled':''}>＋ 새 항목<\/button><\/div><\/section>`}\nfunction amountView(){const r=currentRow(),fresh=!!newItem,item=newItem||r;if(!item)return listView();const rr=records(),index=rr.findIndex(x=>x.id===rowId),extra=r?additions(r):0,current=r?(value(r)??0):0;return `<section class=\"card\"><p class=\"sub\">4단계 · ${kinds[kind]} ${fresh?'새 항목':`${index+1} / ${rr.length}`}<\/p><div class=\"detail-title\">${esc(item.item)}<\/div><div class=\"meta\"><span>${esc(item.category)}<\/span>${item.purpose?`<span>${esc(item.purpose)}<\/span>`:''}<\/div><form id=\"amount-form\"><fieldset ${closed()?'disabled':''}><label for=\"amount\">${['assets','debts'].includes(kind)?'이번 달 말 잔액':'이 항목의 월 전체 '+kinds[kind]} (원)<\/label><input id=\"amount\" name=\"amount\" class=\"amount-input\" type=\"number\" min=\"0\" max=\"100000000000000\" step=\"1\" inputmode=\"numeric\" value=\"${current}\"><div id=\"amount-hint\" class=\"number-hint\">${won(current)}<\/div><label>메모 <span class=\"muted\">(선택)<\/span><textarea name=\"note\" rows=\"2\" maxlength=\"500\" placeholder=\"이 달에 기억할 내용\">${esc(r?.note||'')}<\/textarea><\/label>${!fresh&&['income','expenses'].includes(kind)?`<details><summary>예산도 함께 수정하기 (선택)<\/summary><label>이 달 예산 (원)<input name=\"budget\" type=\"number\" min=\"0\" max=\"100000000000000\" step=\"1\" value=\"${r.budget??''}\" placeholder=\"미설정\"><\/label><\/details>`:''}${extra?`<div class=\"notice\">신규 거래 ${won(extra)}가 이미 포함되어 있어요. 이 금액까지 포함한 월 전체 금액을 입력하세요. 이중으로 더하지 않습니다.<\/div>`:'<p class=\"sub\" style=\"margin-top:16px\">입력값이 없으면 0원으로 저장합니다.<\/p>'}<div class=\"actions\"><button type=\"submit\" name=\"action\" value=\"save\">저장<\/button><button type=\"submit\" name=\"action\" value=\"next\" class=\"primary\">저장 후 다음 →<\/button><\/div><\/fieldset><\/form><div class=\"actions\"><button data-action=\"list\">목록으로<\/button>${!fresh&&index+1<rr.length?'<button data-action=\"skip\">이 항목 건너뛰기 →<\/button>':''}<\/div>${!fresh?'<button class=\"small-link\" data-action=\"previous-row\" style=\"margin-top:12px\">이전 월 불러오기<\/button>':''}<\/section>`}\nfunction confirmKinds(){const zero=records().filter(r=>(value(r)??0)===0),dialog=document.createElement('dialog');dialog.className='zero-dialog';dialog.innerHTML=`<div class=\"zero-dialog-inner\"><p class=\"sub\">${owner} · ${kinds[kind]}<\/p><h2>0원 항목을 확인해 주세요<\/h2><p>다음 항목에 입력된 값이 0원 입니다. 다시 한 번 확인해 주세요.<\/p><ul class=\"zero-list\">${zero.map(r=>`<li><span><strong>${esc(r.item)}<\/strong><br><small>${esc(r.category)}<\/small><\/span><strong>0원<\/strong><\/li>`).join('')||'<li><span>0원 항목이 없습니다.<\/span><\/li>'}<\/ul><div class=\"actions\"><button data-confirm=\"edit\">다시 편집하기<\/button><button class=\"primary\" data-confirm=\"save\">현재 상태 저장<\/button><\/div><\/div>`;document.body.append(dialog);dialog.addEventListener('click',e=>{const choice=e.target.closest('[data-confirm]')?.dataset.confirm;if(!choice)return;dialog.close();dialog.remove();if(choice==='save'){step=2;render()}});dialog.addEventListener('cancel',()=>dialog.remove(),{once:true});dialog.showModal()}\nfunction newView(){const defaults={income:['급여','기타 소득'],expenses:['식비','카페/간식','생활','쇼핑'],assets:['예금','적금','투자','부동산'],debts:['대출']};return `<section class=\"card\"><p class=\"sub\">새 ${kinds[kind]} 항목<\/p><h2>먼저 이름을 정해주세요<\/h2><form id=\"new-item-form\"><label>분류<input name=\"category\" required maxlength=\"120\" list=\"cats\" placeholder=\"예: ${defaults[kind][0]}\"><\/label><datalist id=\"cats\">${[...new Set([...defaults[kind],...records().map(r=>r.category)])].map(c=>`<option value=\"${esc(c)}\">`).join('')}<\/datalist><label>항목·계좌 이름<input name=\"item\" required maxlength=\"120\" placeholder=\"${['assets','debts'].includes(kind)?'예: 국민은행':'예: 급여, 식비'}\"><\/label>${['assets','debts'].includes(kind)?'<label>목적 (선택)<input name=\"purpose\" maxlength=\"120\" placeholder=\"예: 생활비, 주택청약\"><\/label>':''}<div class=\"actio at(-1)||month;\nconst current=()=>state.months[month];\nconst locked=()=>current()?.done.every(Boolean);\nconst rows=(kind,m=month)=>state.months[m]?.[kind]||[];\nconst linked=(kind,id,m=month)=>state.entries.filter(e=>e.kind===kind&&e.rowId===id&&e.date.startsWith(m));\nfunction actual(kind,r,m=month){const extra=sum(linked(kind,r.id,m).filter(e=>e.mode==='add').map(e=>e.amount));return r.amount===null?(extra||null):r.amount+extra}\nfunction total(kind,m=month){return sum(rows(kind,m).map(r=>actual(kind,r,m)||0))}\nfunction complete(kind,m=month){return !!state.months[m]&&rows(kind,m).every(r=>actual(kind,r,m)!==null&&r.confirmed)}\nconst net=(m=month)=>total('assets',m)-total('debts',m);\nconst netReady=(m=month)=>complete('assets',m)&&complete('debts',m);\nfunction prevMonth(m=month){const [y,n]=m.split('-').map(Number);return n===1?`${y-1}-12`:`${y}-${String(n-1).padStart(2,'0')}`}\nfunction toast(msg){$('#toast').textContent=msg;setTimeout(()=>$('#toast').textContent='',4500)}\nfunction persist(){try{validate(state);if(rawBroken)throw Error('기존 기록 읽기 오류가 있어 자동 덮어쓰기를 중단했습니다. 먼저 백업을 내보내고 정상 백업을 복원하세요.');localStorage.setItem(KEY,JSON.stringify(state));storageProblem=false;notifyInputWindows();if(typeof scheduleCloudUpload==='function')scheduleCloudUpload();return true}catch(e){storageProblem=true;alert('저장하지 못했습니다. '+e.message+' 설정에서 현재 JSON을 내려받아 주세요.');return false}}\nfunction commit(fn){if(locked()){toast('마감한 달입니다. 월별 비교·정산에서 마감을 해제하세요.');return false}const before=clone(state);try{fn();if(current())current().done=[false,false];validate(state)}catch(e){state=before;alert(e.message);return false}const saved=persist();render();if(saved)toast('저장했습니다.');return true}\nfunction go(t){if(KINDS[t]){tab='ledger';ledgerKind=t}else if(['report','house'].includes(t)){tab='planning';planningView=t}else if(['settings','source'].includes(t)){tab='admin';adminView=t}else if(t==='diary'){tab='ledger';ledgerKind='diary'}else tab=t;filters={owner:'',category:'',q:'',hideZero:fal h><th>금액<\/th><th>예산<\/th><th>메모<\/th><\/tr><\/thead><tbody>${values.map(x=>`<tr><td>${x.month}<\/td><td>${won(actual(kind,x.row,x.month))}<\/td><td>${won(x.row.budget)}<\/td><td>${esc(x.row.note)||'—'}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div><p class=\"sub\">항목을 수정하거나 다음 달로 가져와도 같은 항목의 기록이 이어집니다. 엑셀에서 목적이 달랐던 계좌는 별도 항목으로 보관했습니다.<\/p>`)}\nfunction diaryView(){const es=state.entries.filter(e=>e.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)),added=sum(es.filter(e=>e.mode==='add'&&e.kind==='expenses').map(e=>e.amount)),evidence=sum(es.filter(e=>e.mode==='evidence'&&e.kind==='expenses').map(e=>e.amount));return `<section class=\"card\"><div class=\"row\" style=\"justify-content:space-between\"><h2>건별 기록<\/h2><div class=\"row\">${button('거래 추가',`data-entry=\"new\" ${locked()?'disabled':''}`,true)}${button('무지출 기록',`id=\"zero-day\" ${locked()?'disabled':''}`)}<\/div><\/div><p class=\"notice\">원본 엑셀은 월별·분류별 합계이며 거래 날짜·상점 정보는 없습니다. 과거 금액을 풀어 적을 때는 ‘기존 합계의 증빙’, 새로운 거래를 더할 때는 ‘신규 거래’를 선택하세요.<\/p><div class=\"stats\">${metric('신규 지출',won(added),'월 지출 합계에 추가됨')}${metric('기존 지출 증빙',won(evidence),'월 지출 합계를 바꾸지 않음')}${metric('이번 달 기록',es.length+'건',`${new Set(es.map(e=>e.date)).size}일 기록`)}<\/div><div class=\"table-wrap\"><table><thead><tr><th>날짜<\/th><th>항목 / 구분<\/th><th>거래 내용<\/th><th>금액<\/th><th>반영 방식<\/th><th>관리<\/th><\/tr><\/thead><tbody>${es.map(e=>{const r=rows(e.kind).find(r=>r.id===e.rowId);return `<tr><td>${e.date}<\/td><td>${esc(r.item)}<div class=\"sub\">${esc(r.owner)} · ${KINDS[e.kind]}<\/div><\/td><td>${esc(e.item)}<div class=\"sub\">${esc(e.note)}<\/div><\/td><td>${won(e.amount)}<\/td><td>${e.mode==='add'?'신규 추가':'기존 합계 증빙'}<\/td><td>${button(locked()?'보기':'수정',`data-entry=\"${e.id}\"`)}<\/td><\/tr>`}).join('')||'<tr><td colspan=\"6\">아직 건별 기록이 없습니다. 원본 월 합계는 수입·지출 메뉴에서 확인하세요.<\/td><\/tr>'}<\/tbody><\/table><\/div><\/section><section class=\"card\"><h2>기존 월 합계의 상세 기록 현황<\/h2><div class=\"table-wrap\"><table><thead><tr><th>항목<\/th><th>기본 합계<\/th><th>입력한 증빙<\/th><th>아직 풀어 쓰지 않은 금액<\/th><\/tr><\/thead><tbody>${rows('expenses').filter(r=>linked('expenses',r.id).some(e=>e.mode==='evidence')).map(r=>{const ev=sum(linked('expenses',r.id).filter(e=>e.mode==='evidence').map(e=>e.amount));return `<tr><td>${esc(r.item)} · ${esc(r.owner)}<\/td><td>${won(r.amount)}<\/td><td>${won(ev)}<\/td><td class=\"${ev>(r.amount||0)?'negative':''}\">${r.amount===null?'기본 합계 미입력':won(r.amount-ev)}<\/td><\/tr>`}).join('')||'<tr><td colspan=\"4\">기존 합계의 증빙을 입력하면 항목별 남은 금액을 확인할 수 있어요.<\/td><\/tr>'}<\/tbody><\/table><\/div><\/section>`}\nfunction entryDialog(id,zero=false){const e=state.entries.find(e=>e.id===id)||{id:uid(),date:month===today().slice(0,7)?today():month+'-01',kind:'expenses',rowId:rows('expenses')[0]?.id||'',mode:'add',item:zero?'무지출 하루':'',amount:0,note:''};openDialog(`<h2>${id==='new'?'거래 추가':'거래 수정'}<\/h2><form id=\"entry-form\" data-id=\"${e.id}\"><fieldset ${locked()?'disabled':''}><div class=\"fields\"><label>날짜<input name=\"date\" type=\"date\" required value=\"${e.date}\" min=\"${month}-01\" max=\"${month}-${new Date(Number(month.slice(0,4)),Number(month.slice(5)),0).getDate()}\"><\/label><label>종류<select name=\"kind\" id=\"entry-kind\">${Object.entries({expenses:'지출',income:'수입'}).map(([v,l])=>`<option value=\"${v}\" ${e.kind===v?'selected':''}>${l}<\/option>`).join('')}<\/select><\/label><label class=\"wide\">연결할 월 항목<select name=\"rowId\" id=\"entry-row\" required>${entryOptions(e.kind,e.rowId)}<\/select><\/label><label class=\"wide\">반영 방식<select name=\"mode\"><option value=\"add\" ${e.mode==='add'?'selected':''}>신규 거래 — 월 합계에 금액 추가<\/option><option value=\"evidence\" ${e.mode==='evidence'?'selected':''}>기존 합계의 증빙 — 합계 그대로<\/option><\/select><\/label><label>상점·거래 내용<input name=\"item\" required maxlength=\"120\" value=\"${esc(e.item)}\"><\/label><label>금액 (원)<input name=\"amount\" type=\"number\" min=\"0\" max=\"100000000000000\" step=\"1\" required value=\"${e.amount}\"><\/label><label class=\"wide\"> category))].map(c=>{const val=date=>sum(rows('expenses',date).filter(r=>r.category===c).map(r=>actual('expenses',r,date)||0)),v=val(month),p=val(comparison);return `<tr><td>${esc(c)}<\/td><td>${won(p)}<\/td><td>${won(v)}<\/td><td>${won(v-p)}<\/td><\/tr>`}).join('')}<\/tbody><\/table><\/div><\/section><section class=\"card\"><h2>월말 메모와 함께 확인<\/h2><form id=\"month-note\"><label>이번 달 돌아보기<textarea name=\"note\" maxlength=\"500\" rows=\"3\" ${locked()?'disabled':''}>${esc(m.note)}<\/textarea><\/label><div class=\"actions\">${button('메모 저장',locked()?'disabled':'')}<\/div><\/form><p class=\"notice\">자산·부채·수입·지출의 미입력 항목을 채우고 확인합니다. 두 사람 모두 확인하면 이 달은 수정 잠금 상태가 됩니다.<\/p>${state.names.map((n,i)=>`<div class=\"check\"><span>${esc(n)} · ${m.done[i]?'확인 완료':'확인 대기'}<\/span>${button(m.done[i]?'확인 완료':'정산 확인',`data-confirm=\"${i}\" ${m.done[i]?'disabled':''}`)}<\/div>`).join('')}${m.done.some(Boolean)?`<div class=\"actions\">${button('확인 해제 / 수정 다시 열기','id=\"reopen\"')}<\/div>`:''}<\/section>`}`}\nfunction newMonthView(){return `<section class=\"card\"><h2>${month}은 아직 시작하지 않았어요.<\/h2><p>이전 월의 항목을 가져와 새 달의 예산과 잔액을 관리하세요. 수입·지출 실제 금액과 거래 내역은 복사하지 않습니다.<\/p><div class=\"actions\">${button('이 달 시작하기','id=\"new-month\"',true)}${button('기존 월 보기','data-go=\"report\"')}<\/div><\/section>`}\nfunction newMonthDialog(){const all=Object.keys(state.months).sort();openDialog(`<h2>새 달 시작<\/h2><form id=\"new-month-form\"><div class=\"fields\"><label>새로 관리할 월<input name=\"month\" type=\"month\" min=\"1900-01\" max=\"9999-12\" required value=\"${current()?nextMonth(month):month}\"><\/label><label>항목을 가져올 월<select name=\"from\">${selectOptions(all,current()?month:all.at(-1))}<\/select><\/label><label class=\"wide check-inline\"><input type=\"checkbox\" name=\"carry\" checked>자산·부채 잔액을 확인 대기 상태로 가져오기<\/label><\/div><p class=\"notice\">자산·부채 항목과 고정비 목록을 가져옵니다. 수입·지출·고정비의 예산은 기존 예산 또는 실제 금액으로 채우고, 실제 금액은 미입력으로 시작합니다. 거래 상세와 정산 확인은 복사하지 않습니다.<\/p><div class=\"actions\">${button('새 달 만들기','',true)}<\/di nction planningHubView(){const tabs=[['report','월별 비교·정산'],['house','내집마련·목표']];return `${viewTabs(tabs,planningView,'planning-view')}${planningView==='report'?`<section class=\"card\"><h2>수입·지출 흐름<\/h2>${cashflowChart()}<\/section>${reportView()}`:`${chartPanel('assets','category')}${houseView()}`}`}\nfunction adminHubView(){return `${viewTabs([['settings','설정·백업'],['source','원본 비교']],adminView,'admin-view')}${adminView==='settings'?settingsView():sourceView()}`}\nfunction inputSummaryCharts(){if(!current())return '';const data=['income','expenses','assets','debts'].map(kind=>{const rr=rows(kind),done=rr.filter(r=>r.amount!==null&&r.confirmed).length;return [KINDS[kind],done,rr.length]});return `<section class=\"card\"><h2>${month} 입력 진행률<\/h2><div class=\"progress-chart\">${data.map(([label,done,all])=>`<div><div class=\"bar-label\"><span>${label}<\/span><strong>${done} / ${all}<\/strong><\/div><progress max=\"${all||1}\" value=\"${done}\"><\/progress><\/div>`).join('')}<\/div><h3>사람별 자산 구성<\/h3>${compositionChart('assets','owner')}<\/section>`}\ndocument.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.ledgerKind){ledgerKind=b.dataset.ledgerKind;filters={owner:'',category:'',q:'',hideZero:false};render()}if(b.dataset.planningView){planningView=b.dataset.planningView;render()}if(b.dataset.adminView){adminView=b.dataset.adminView;render()}});\ndocument.addEventListener('change',event=>{if(event.target.id==='chart-kind'){chartKind=event.target.value;render()}if(event.target.id==='chart-dimension'){chartDimension=event.target.value;render()}if(event.target.id==='ledger-chart-kind'){ledgerKind=event.target.value;filters={owner:'',category:'',q:'',hideZero:false};render()}if(event.target.id==='ledger-from'){ledgerFrom=event.target.value;if(ledgerFrom>ledgerTo)ledgerTo=ledgerFrom;render()}if(event.target.id==='ledger-to'){ledgerTo=event.target.value;if(ledgerTo<ledgerFrom)ledgerFrom=ledgerTo;render()}});\n\n// The dashboa (!m)throw Error('먼저 이 달을 시작하세요.');if(m.done.every(Boolean))throw Error('마감된 달입니다. 대시보드의 월별 비교·정산에서 마감을 해제하세요.');\n    const r=m[kind].find(r=>r.id===request.id),v=request.values;\n    if(!v||(v.amount!==null&&!money(v.amount))||typeof v.note!=='string'||v.note.length>500)throw Error('금액과 메모를 확인하세요.');\n    if(r){\n     if(r.owner!==owner)throw Error('선택한 입력자의 항목이 아닙니다.');\n     if(inputSignature(kind,r,selected)!==request.signature)throw Error('이 항목이 다른 창에서 변경되었습니다. 입력값을 복사해 두고 최신 값으로 다시 열어 주세요.');\n     const extra=sum(linked(kind,r.id,selected).filter(e=>e.mode==='add').map(e=>e.amount));\n     if(v.amount===null&&extra>0)throw Error('신규 거래가 연결되어 있어 미입력으로 바꿀 수 없습니다. 거래 상세에서 먼저 확인하세요.');\n     if(v.amount!==null&&v.amount<extra)throw Error(`기록된 신규 거래 ${won(extra)}보다 월 전체 금액이 작습니다. 거래 상세에서 먼저 확인하세요.`);\n     r.amount=v.amount===null?null:v.amount-extra;r.note=v.note;r.confirmed=v.amount!==null;\n     if(v.budget!==undefined){if(!['income','expenses'].includes(kind)||(v.budget!==null&&!money(v.budget)))throw Error('예산을 확인하세요.');r.budget=v.budget;}\n    }else{\n     if(request.id||!request.newItem)throw Error('항목이 삭제되었거나 존재하지 않습니다. 목록을 새로 불러오세요.');\n     const item=request.newItem;if(!['category','item','purpose'].every(k=>typeof item[k]==='string'&&item[k].length<=120)||!item.category.trim()||!item.item.trim())throw Error('새 항목의 분류와 이름을 확인하세요.');\n     if(m[kind].some(r=>r.owner===owner&&r.category===item.category.trim()&&r.item===item.item.trim()&&r.purpose===item.purpose.trim()))throw Error('같은 항목이 이미 있습니다. 목록에서 해당 항목을 선택하세요.');\n     m[kind].push({id:uid(),category:item.category.trim(),item:item.item.trim(),purpose:item.purpose.trim(),owner,amount:v.amount,budget:null,note:v.note,source:'월별 내역 입력 창',confirmed:v.amount!==null});\n    }\n    m.done=[false,false];\n   }else throw Error('지원하지 않는 요청입니다.');\n   validate(state);if(!persist())throw Error('브라우저에 저장하지 못했습니다. 입력값을 보관한 뒤 대시보드의 저장 상태를 확인하세요.');\n  }catch(err){state=before;month=oldMonth;throw err}\n  render();  class=\"notice\">다른 기기에도 같은 동기화 코드와 비밀번호를 입력하세요. 비밀번호를 잊으면 클라우드 데이터를 복구할 수 없습니다.<\/p><div class=\"actions\"><button type=\"button\" id=\"cloud-generate\">새 동기화 코드 만들기<\/button><button class=\"primary\">연결 설정 저장<\/button><\/div><\/form><div class=\"actions\"><button id=\"cloud-upload\" ${ready?'':'disabled'}>현재 데이터를 클라우드에 저장<\/button><button id=\"cloud-download\" ${ready?'':'disabled'}>클라우드 데이터 불러오기<\/button><button id=\"cloud-disconnect\" ${ready?'':'disabled'}>이 기기 연결 해제<\/button><\/div><p class=\"sub\">마지막 확인: ${esc(last)} · 자동 저장은 연결 설정 후 활성화됩니다.<\/p><div id=\"cloud-status\" class=\"saved\" role=\"status\" aria-live=\"polite\"><\/div><\/section>`}\nconst bytesToBase64=bytes=>{let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s)};\nconst base64ToBytes=text=>Uint8Array.from(atob(text),c=>c.charCodeAt(0));\nasync function cloudKey(){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(cloudConfig.passphrase),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode(cloudConfig.syncId),iterations:180000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}\nasync function cloudEncrypt(value){const iv=crypto.getRandomValues(new Uint8Array(12)),key=await cloudKey(),data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(value)));return {version:1,iv:bytesToBase64(iv),data:bytesToBase64(new Uint8Array(data))}}\nasync function cloudDecrypt(payload){if(!payload||payload.version!==1)throw Error('지원하지 않는 클라우드 데이터입니다.');const key=await cloudKey(),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:base64ToBytes(payload.iv)},key,base64ToBytes(payload.data));return JSON.parse(new TextDecoder().decode(plain))}\nfunction cloudHeaders(extra={}){return {'apikey':cloudConfig.anonKey,'Authorization':`Bearer ${cloudConfig.anonKey}`,'Content-Type':'application/json',...extra}}\nasync function cloudFetch(){const url=`${cloudCon
