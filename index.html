/* Mobile-first polish for phone Chrome. Desktop layout remains unchanged. */
@media (max-width:650px){
  :root{--mobile-key:#007e72;--mobile-key-dark:#075f58;--mobile-tint:#e7f4f1;--mobile-surface:#fff}
  html{scroll-padding-top:132px}
  body{background:#f3f7f8;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font-size:16px}
  button{min-height:44px}

  .shell aside{

    border:0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);
    box-shadow:0 5px 18px rgba(21,44,50,.07);backdrop-filter:blur(12px)
  }

    scroll-snap-type:x proximity;scrollbar-width:none

    flex:0 0 auto;min-height:40px;padding:8px 13px;border:1px solid transparent;
    border-radius:999px;font-size:13px;scroll-snap-align:start
  }
  .shell nav button.active{
    color:#fff;background:var(--mobile-key);border-color:var(--mobile-key);
    box-shadow:0 5px 12px rgba(0,126,114,.2)
  }

  .shell>main{padding:18px 14px 72px}
  .shell>main>header{
    display:grid;grid-template-columns:1fr;align-items:start;gap:12px;
    margin:0 0 16px;padding:0 2px

  .shell>main>header .sub{max-width:none;font-size:13px;line-height:1.45}

  .shell>main>header input{width:150px;min-height:44px;margin-top:0;padding:8px}

  .monthbar{
    display:grid;grid-template-columns:auto 1fr;gap:7px 9px;align-items:center;
    margin:0 0 14px;padding:12px;border:1px solid #cfe3e1;border-radius:16px;background:var(--mobile-tint)
  }
  .monthbar button{grid-column:1/-1;width:100%;margin:2px 0 0;background:#fff;border-color:#b9d5d2}
  .card,.stat{border-color:#d7e4e6;border-radius:20px;box-shadow:0 5px 18px rgba(21,44,50,.045)}
  .card{padding:18px;margin-bottom:14px}
  .card h2{font-size:21px;line-height:1.25;margin-bottom:15px}

  .hero .big{font-size:31px;line-height:1.1}

  .chart-head{gap:14px;margin-bottom:16px}
  .chart-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
  .chart-controls label{min-width:0;font-size:12px}
  .chart-controls select{min-height:44px}
  .chart-grid{gap:24px}
  .data-chart{min-height:0;max-height:190px}
  .chart-key{gap:7px 12px;margin:10px 0}
  .chart-key span{font-size:12px}
  .bar-row{margin-bottom:14px}
  .bar-label{font-size:13px}
  .bar-track{height:10px}
  .big-number{font-size:30px;line-height:1.15;overflow-wrap:anywhere}
  .view-tabs{gap:7px;margin:0 -4px 16px;padding:4px;scrollbar-width:none}
  .view-tabs::-webkit-scrollbar{display:none}
  .view-tabs button{min-height:40px;padding:8px 12px;border-radius:999px;font-size:13px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .filters label{min-width:0}
  .filters .wide,.filters .check-inline{grid-column:1/-1}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .actions button{width:100%;min-width:0;padding:10px 8px}
  .actions button:last-child:nth-child(odd){grid-column:1/-1}
  .table-wrap{margin:0 -18px;padding:0 18px;max-height:70vh}
  dialog{width:calc(100vw - 20px);max-height:92vh;padding:18px;border-radius:20px}
  footer{padding:4px 2px 18px;line-height:1.5}

  body>main{padding:18px 16px 48px}
  body>main>header{margin:0 0 18px;padding:18px;border-radius:20px;background:var(--mobile-tint)}
  body>main>header h1{font-size:31px;line-height:1.05}
  body>main .context{padding:4px 2px 8px}

  body>main .card{padding:20px}
  body>main .amount-input{font-size:30px}
}

=\"comparison\" style=\"width:180px\">${selectOptions(all,comparison)}<\/select><\/div><div class=\"stats\">${metric('순자산 차이',a!==null&&b!==null?won(a-b):'잔액 확인 필요')}${metric('수입 차이',old?won(total('income')-total('income',comparison)):'비교 자료 없음')}${metric('지출 차이',old?won(total('expenses')-total('expenses',comparison)):'비교 자료 없음')}<\/div><div class=\"table-wrap\"><table><thead><tr><th>지출 분류<\/th><th>${comparison}<\/th><th>${month}<\/th><th>변화<\/th><\/tr><\/thead><tbody>${[...new Set([...rows('expenses'),...rows('expenses',comparison)].map(r=>r.category))].map(c=>{const val=date=>sum(rows('expenses',date).filter(r=>r.category===c).map(r=>actual('expenses',r,date)||0)),v=val(month),p=val(comparison);return `<tr><td>${esc(c)}<\/td><td>${won(p)}<\/td><td>${won(v)}<\/td><td>${won(v-p)}<\/td><\/tr>`}).join('')}<\/tbody><\/table><\/div><\/section><section class=\"card\"><h2>월말 메모와 함께 확인<\/h2><form id=\"month-note\"><label>이번 달 돌아보기<textarea name=\"note\" maxlength=\"500\" rows=\"3\" ${locked()?'disabled':''}>${esc(m.note)}<\/textarea><\/label><div class=\"actions\">${button('메모 저장',locked()?'disabled':'')}<\/div><\/form><p class=\"notice\">자산·부채·수입·지출의 미입력 항목을 채우고 확인합니다. 두 사람 모두 확인하면 이 달은 수정 잠금 상태가 됩니다.<\/p>${state.names.map((n,i)=>`<div class=\"check\"><span>${esc(n)} · ${m.done[i]?'확인 완료':'확인 대기'}<\/span>${button(m.done[i]?'확인 완료':'정산 확인',`data-confirm=\"${i}\" ${m.done[i]?'disabled':''}`)}<\/div>`).join('')}${m.done.some(Boolean)?`<div class=\"actions\">${button('확인 해제 / 수정 다시 열기','id=\"reopen\"')}<\/div>`:''}<\/section>`}`}\nfunction newMonthView(){return `<section class=\"card\"><h2>${month}은 아직 시작하지 않았어요.<\/h2><p>이전 월의 항목을 가져와 새 달의 예산과 잔액을 관리하세요. 수입·지출 실제 금액과 거래 내역은 복사하지 않습니다.<\/p><div class=\"actions\">${button('이 달 시작하기','id=\"new-month\"',true)}${button('기존 월 보기','data-go=\"report\"')}<\/div><\/section>`}\nfunction newMonthDialog(){const all=Object.keys(state.months).sort();openDialog(`<h2>새 달 시작<\/h2><form id=\"new-month-form\"><div class=\"fields\"><label>새로 관리할 orm\"><div class=\"fields\"><label class=\"wide\">Supabase 프로젝트 URL<input name=\"url\" type=\"url\" required placeholder=\"https://프로젝트.supabase.co\" value=\"${esc(cloudConfig.url||'')}\"><\/label><label class=\"wide\">Supabase Publishable key 또는 anon key<input name=\"anonKey\" type=\"password\" required autocomplete=\"off\" value=\"${esc(cloudConfig.anonKey||'')}\"><\/label><label>가족 동기화 코드<input name=\"syncId\" required maxlength=\"36\" value=\"${esc(cloudConfig.syncId||'')}\"><\/label><label>동기화 비밀번호<input name=\"passphrase\" type=\"password\" required minlength=\"10\" autocomplete=\"off\" value=\"${esc(cloudConfig.passphrase||'')}\"><\/label><\/div><p class=\"notice\">다른 기기에도 같은 동기화 코드와 비밀번호를 입력하세요. 비밀번호를 잊으면 클라우드 데이터를 복구할 수 없습니다.<\/p><div class=\"actions\"><button type=\"button\" id=\"cloud-generate\">새 동기화 코드 만들기<\/button><button class=\"primary\">연결 설정 저장<\/button><\/div><\/form><div class=\"actions\"><button id=\"cloud-upload\" ${ready?'':'disabled'}>현재 데이터를 클라우드에 저장<\/button><button id=\"cloud-download\" ${ready?'':'disabled'}>클라우드 데이터 불러오기<\/button><button id=\"cloud-disconnect\" ${ready?'':'disabled'}>이 기기 연결 해제<\/button><\/div><p class=\"sub\">마지막 확인: ${esc(last)} · 자동 저장은 연결 설정 후 활성화됩니다.<\/p><div id=\"cloud-status\" class=\"saved\" role=\"status\" aria-live=\"polite\"><\/div><\/section>`}\nconst bytesToBase64=bytes=>{let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s)};\nconst base64ToBytes=text=>Uint8Array.from(atob(text),c=>c.charCodeAt(0));\nasync function cloudKey(){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(cloudConfig.passphrase),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode(cloudConfig.syncId),iterations:180000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}\nasync function cloudEncrypt(value){const iv=crypto.getRandomValues(new Uint8Array(12)),key=await cloudKey(),data=await crypto.subtle.encrypt({nam OUD_CONFIG_KEY);render()}});\nsetTimeout(()=>{if(cloudReady())cloudDownload(false)},0);\n"</script>
