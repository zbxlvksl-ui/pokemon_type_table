/* Mobile-first polish for phone Chrome. Desktop layout remains unchanged. */
@media (max-width:650px){
  :root{--mobile-key:#007e72;--mobile-key-dark:#075f58;--mobile-tint:#e7f4f1;--mobile-surface:#fff}
  html{scroll-padding-top:132px}
  body{background:#f3f7f8;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font-size:16px}
  button{min-height:44px}

  .shell aside{
    position:sticky;top:0;z-index:20;height:auto;padding:11px 14px 0;
    border:0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);
    box-shadow:0 5px 18px rgba(21,44,50,.07);backdrop-filter:blur(12px)
  }
  .shell aside>.eyebrow{display:none}
  .shell aside .brand{font-size:20px;line-height:1.1;white-space:nowrap}
  .version-mark{margin:6px 0 0!important;padding:3px 7px!important;font-size:10px!important}
  .shell nav{
    display:flex;gap:6px;margin:8px -14px 0;padding:0 14px 10px;overflow-x:auto;
    scroll-snap-type:x proximity;scrollbar-width:none
  }
  .shell nav::-webkit-scrollbar{display:none}
  .shell nav button{
    flex:0 0 auto;min-height:40px;padding:8px 13px;border:1px solid transparent;
    border-radius:999px;font-size:13px;scroll-snap-align:start
  }
  .shell nav button.active{
    color:#fff;background:var(--mobile-key);border-color:var(--mobile-key);
    box-shadow:0 5px 12px rgba(0,126,114,.2)
  }

  .shell>main{padding:18px 14px 72px}
  .shell>main>header{
    display:grid;grid-template-columns:1fr;align-items:start;gap:12px;
    margin:0 0 16px;padding:0 2px
  }
  .shell>main>header h1{font-size:32px;line-height:1}
  .shell>main>header .sub{max-width:none;font-size:13px;line-height:1.45}
  .shell>main>header label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;text-align:left}
  .shell>main>header input{width:150px;min-height:44px;margin-top:0;padding:8px}

  .monthbar{
    display:grid;grid-template-columns:auto 1fr;gap:7px 9px;align-items:center;
    margin:0 0 14px;padding:12px;border:1px solid #cfe3e1;border-radius:16px;background:var(--mobile-tint)
  }
  .monthbar button{grid-column:1/-1;width:100%;margin:2px 0 0;background:#fff;border-color:#b9d5d2}
  .card,.stat{border-color:#d7e4e6;border-radius:20px;box-shadow:0 5px 18px rgba(21,44,50,.045)}
  .card{padding:18px;margin-bottom:14px}
  .card h2{font-size:21px;line-height:1.25;margin-bottom:15px}
  .stat{padding:16px}
  .hero{padding:22px;background:linear-gradient(145deg,var(--mobile-key-dark),#123e42)}
  .hero .big{font-size:31px;line-height:1.1}

  .chart-head{gap:14px;margin-bottom:16px}
  .chart-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
  .chart-controls label{min-width:0;font-size:12px}
  .chart-controls select{min-height:44px}
  .chart-grid{gap:24px}
  .data-chart{min-height:0;max-height:190px}
  .chart-key{gap:7px 12px;margin:10px 0}
  .chart-key span{font-size:12px}
  .bar-row{margin-bottom:14px}
  .bar-label{font-size:13px}
  .bar-track{height:10px}
  .big-number{font-size:30px;line-height:1.15;overflow-wrap:anywhere}
  .view-tabs{gap:7px;margin:0 -4px 16px;padding:4px;scrollbar-width:none}
  .view-tabs::-webkit-scrollbar{display:none}
  .view-tabs button{min-height:40px;padding:8px 12px;border-radius:999px;font-size:13px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .filters label{min-width:0}
  .filters .wide,.filters .check-inline{grid-column:1/-1}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .actions button{width:100%;min-width:0;padding:10px 8px}
  .actions button:last-child:nth-child(odd){grid-column:1/-1}
  .table-wrap{margin:0 -18px;padding:0 18px;max-height:70vh}
  dialog{width:calc(100vw - 20px);max-height:92vh;padding:18px;border-radius:20px}
  footer{padding:4px 2px 18px;line-height:1.5}

  body>main{padding:18px 16px 48px}
  body>main>header{margin:0 0 18px;padding:18px;border-radius:20px;background:var(--mobile-tint)}
  body>main>header h1{font-size:31px;line-height:1.05}
  body>main .context{padding:4px 2px 8px}
  body>main .steps{margin-top:14px}
  body>main .card{padding:20px}
  body>main .amount-input{font-size:30px}
}
