  .chart-controls select{min-height:44px}
  .chart-grid{gap:24px}
  .data-chart{min-height:0;max-height:190px}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .actions button{width:100%;min-width:0;padding:10px 8px}
  .actions button:last-child:nth-child(odd){grid-column:1/-1}
  .table-wrap{margin:0 -18px;padding:0 18px;max-height:70vh}
  dialog{width:calc(100vw - 20px);max-height:92vh;padding:18px;border-radius:20px}
  footer{padding:4px 2px 18px;line-height:1.5}

  body>main{padding:18px 16px 48px}

  body>main .amount-input{font-size:30px}
}

><section class=\"card\"><h2>저축률로 그려보는 10년<\/h2><form id=\"projection-form\"><label>월 수입 중 저축률 (%)<input name=\"rate\" type=\"number\" min=\"0\" max=\"100\" step=\"1\" required value=\"${state.rate}\"><\/label><div class=\"actions\">${button('계산하기','',true)}<\/div><\/form><div class=\"stats\">${metric('매월 저축 가정',won(monthly))}${metric('10년 뒤 순자산',netReady()?won(future):'잔액 확인 필요')}${metric('목표까지',!netReady()?'잔액 확인 필요':remaining===0?'목표 달성':duration===null?'수입·저축률 필요':`${Math.floor(duration/12)}년 ${duration%12}개월`)}<\/div><p class=\"notice\">선택한 월 수입 ${won(income)}을 기준으로 합니다. 수익률 0%, 집값 고정이며 세금·대출·물가를 반영하지 않습니다. 순자산 전체를 매입 자금으로 가정한 단순 계산입니다.<\/p><\/section>`}\nfunction captureSourceMonth(date){const live=state.months[date];if(!live)return null;const copy=clone(live);for(const kind of Object.keys(KINDS))copy[kind]=live[kind].map(row=>({...clone(row),amount:actual(kind,row,date),confirmed:actual(kind,row,date)!==null,source:`HTML 입력 기준 · ${date}`}));return copy}\nfunction sourceMonth(date){return state.sourceOverrides?.[date]||captureSourceMonth(date)}\nfunction sourceChanges(date){const base=state.sourceOverrides?.[date],live=state.months[date];if(!base||!live)return 0;let count=0;for(const kind of Object.keys(KINDS)){const ids=new Set([...base[kind].map(r=>r.id),...live[kind].map(r=>r.id)]);for(const id of ids){const a=base[kind].find(r=>r.id===id),b=live[kind].find(r=>r.id===id),value=b?actual(kind,b,date):null;if(!a||!b||a.amount!==value||a.category!==b.category||a.item!==b.item||a.owner!==b.owner||a.purpose!==b.purpose)count++}}return count}\nfunction sourceDialog(){const months=Object.keys(state.months).sort();openDialog(`<h2>원본 데이터 변경<\/h2><p>선택한 월의 현재 HTML 입력값을 원본 기준으로 저장합니다.<\/p><form id=\"source-baseline-form\"><div class=\"fields\">${months.map(date=>`<label class=\"check-inline\"><input type=\"checkbox\" name=\"source-month\" value=\"${date}\" ${date===month?'checked':''}>${date}${state.sourceOverrides?.[date]?' · 기준본 저장됨':''}<\/label>`).join('')}<\/div><p class=\"notice\">선택한 월만 갱신합니다. 이후 입력값을 수정해도 저장된 원본 기준은 자동으로 바뀌지 않습니다.<\/p><div class=\"actions\">${button('선택한 월을 원본으로 저장','',true)}<\/div><\/form>`)}\nfunction sourceView(){const src=sourceMonth(month),saved=!!state.sourceOverrides?.[month],changed=sourceChanges(month);return `<section class=\"card\"><div class=\"row\" style=\"justify-content:space-between\"><div><span class=\"eyebrow\">HTML 입력 기준<\/span><h2>원본 데이터 관리<\/h2><\/div>${button('원본 데이터 변경','id=\"change-source\"',true)}<\/div><p>이 화면에 입력하고 저장한 값을 원본 데이터의 기준으로 사용합니다.<\/p><div class=\"stats\">${metric('선택한 월',month,saved?'저장된 원본 기준':'현재 입력값을 임시 기준으로 표시')}${metric('기준 저장 상태',saved?'원본 저장됨':'아직 저장 전',saved?`${changed}개 항목이 기준본과 다름`:'원본 데이터 변경에서 저장 가능')}${metric('현재 항목 수',Object.keys(KINDS).reduce((n,k)=>n+(src?.[k]?.length||0),0)+'개','자산·부채·수입·지출·고정비 포함')}<\/div><p class=\"notice\">${saved?'현재 입력값과 저장된 원본을 비교할 수 있습니다. 원본을 갱신하려면 변경할 월을 선택하세요.':'현재 HTML 입력값을 기준으로 표시하고 있습니다. 원본 데이터 변경에서 이 월을 선택하면 기준본으로 확정됩니다.'}<\/p><\/section><section class=\"card\"><div class=\"row\" style=\"justify-content:space-between\"><h2>${month} 원본 항목<\/h2>${button('원본 추출 JSON','id=\"export-source\"')}<\/div>${src?Object.keys(KINDS).map(kind=>`<details><summary>${KINDS[kind]} · ${src[kind].length}개<\/summary><div class=\"table-wrap\"><table><thead><tr><th>분류<\/th><th>항목<\/th><th>구분<\/th><th>목적·업체<\/th><th>원본 금액<\/th><th>기준<\/th><\/tr><\/thead><tbody>${src[kind].map(row=>`<tr><td>${esc(row.category)}<\/td><td>${esc(row.item)}<\/td><td>${esc(row.owner)}<\/td><td>${esc(row.purpose)}<\/td><td>${won(row.amount)}<\/td><td>${esc(row.source)}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div><\/details>`).join(''):'<p class=\"empty\">이 월의 입력 데이터가 없습니다.<\/p>'}<\/section>`}\nfunction settingsView(){return `<section class=\"card\"><h2>목표와 정산 확인 이름<\/h2><form id=\"settings-form\"><div class=\"fields\">${state.names.map((n,i)=>`<label>정산 확인 ${i+1}<input name=\"name${i}\" required maxlength=\"20\" value=\"${esc(n)}\"><\/label>`).join('')}<label>10년 순자산 목표 (원)<input type=\"number\" name=\"goal\" min=\"1\" max=\"100000000000000\" required value=\"${state.goal}\"><\/label><label>내집마련 목표 (원)<input type=\"number\" name=\"homePrice\" min=\"1\" max=\"100000000000000\" required value=\"${state.homePrice}\"><\/label><\/div><p class=\"sub\">정산 확인 이름을 바꿔도 원본의 구분(신랑·신부·공급관리)은 유지됩니다.<\/p><div class=\"actions\">${button('설정 저장','',true)}<\/div><\/form><\/section>${typeof cloudSyncView==='function'?cloudSyncView():''}<section class=\"card\"><h2>백업과 복원<\/h2><p>모든 월의 항목·예산·거래 상세·메모·정산 상태를 JSON으로 보관합니다.<\/p><div class=\"actions\">${button('현재 기록 내보내기','id=\"export\"',true)}${button('백업 가져오기','id=\"import\"')}${button('이전 HTML의 기록 백업','id=\"export-old\"')}${button('화면 인쇄 / PDF','id=\"print\"')}<\/div><input id=\"backup-file\" type=\"file\" accept=\".json,application/json\" hidden><p class=\"notice\">클라우드 동기화를 사용하더라도 JSON 백업을 정기적으로 보관하세요. 이 HTML에는 실제 자산 정보가 들어 있으므로 파일 공유에 주의하세요.<\/p><\/section><section class=\"card\"><h2>월별 관리 순서<\/h2><ol><li>새 달 시작으로 전월의 계좌와 분류를 가져옵니다.<\/li><li>자산·부채 잔액을 확인하고 각 항목을 저장합니다.<\/li><li>수입·지출·고정비의 예산과 실제 금액을 입력합니다.<\/li><li>거래 상세에서 신규 거래 또는 기존 합계의 증빙을 기록합니다.<\/li><li>월별 비교를 확인한 후 두 사람이 정산을 마감합니다.<\/li><\/ol><\/section>`}\nfunction csvExport(kind){const headers=['월','분류','항목','구분','목적/업체','기본 금액','최종 실제','예산','메모','출처'];const safe=v=>{let s=String(v??'');if(/^[=+@\\-\\t\\r]/.test(s))s=\"'\"+s;return '\"'+s.replaceAll('\"','\"\"')+'\"'};const data=[headers,...filtered(kind).map(r=>[month,r.category,r.item,r.owner,r.purpose,r.amount,actual(kind,r),r.budget,r.note,r.source])].map(row=>row.map(safe).join(',')).join('\\r\\n');download('\\ufeff'+data,`${month}_${KINDS[kind]}.csv`,'text/csv;charset=utf-8')}\ndocument.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.inputMonth){setMonth(d.inputMonth);openMonthlyInput();return}if(d.go){go(d.go);return}if(d.month){setMonth(d.month);return}if(d.add){rowDialog(d.add);return}if(d.edit){rowDialog(d.edit,d.id);return}if
